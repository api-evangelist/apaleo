aid: apaleo
url: https://raw.githubusercontent.com/api-evangelist/apaleo/refs/heads/main/apis.yml
name: apaleo
kind: company
description: apaleo is an API-first cloud hotel property-management system (PMS) and
  platform. Every capability - reservations, bookings, blocks, inventory, rate plans,
  availability, and finance - is exposed through documented REST APIs secured with
  OAuth 2.0, published as OpenAPI, with webhooks for real-time events, enabling an
  open marketplace of integrations.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Hospitality
- PMS
- Property Management
- Hotels
- API-First
created: '2026-06-25'
modified: '2026-06-25'
specificationVersion: '0.19'
