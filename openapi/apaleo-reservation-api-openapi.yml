components:
  schemas:
    GuestModel:
      type: object
      description: 'Guest on v0-nsfw booking endpoints. Sibling of Apaleo.Api.Modules.Booking.Models.Reservation.GuestModel (not a subclass):

        Swagger schema ids strip "Unstable", so inheriting the stable type would collide on "GuestModel".'
      required:
      - lastName
      properties:
        title:
          type:
          - string
          - 'null'
          description: Title of the guest
          enum:
          - Mr
          - Ms
          - Dr
          - Prof
          - Mrs
          - Other
        gender:
          type:
          - string
          - 'null'
          description: 'Gender of the guest

            Allowed values for this field depend on the country in which the property is located.

            Use /booking/v0-nsfw/types/Gender/allowed-values to check what values are allowed.'
          enum:
          - Female
          - Male
          - Other
          - Unknown
        firstName:
          type:
          - string
          - 'null'
          description: First name of the guest
        middleInitial:
          type:
          - string
          - 'null'
          description: Middle initial of the guest
        lastName:
          type: string
          description: Last name of the guest
          minLength: 1
        secondLastName:
          type:
          - string
          - 'null'
          description: Second last name of the guest
        email:
          type:
          - string
          - 'null'
          description: Email address of the guest
        phone:
          type:
          - string
          - 'null'
          description: Phone number of the guest
        address:
          $ref: '#/components/schemas/PersonAddressModel'
        nationalityCountryCode:
          type:
          - string
          - 'null'
          description: The guest's nationality, in ISO 3166-1 alpha-2 code
        identificationNumber:
          type:
          - string
          - 'null'
          description: The guest's identification number for the given identificationType.
        identificationAdditionalNumber:
          type:
          - string
          - 'null'
          description: The guest's additional identification number for the given identificationType.
        identificationIssueDate:
          type:
          - string
          - 'null'
          description: The issue date of the guest's identification document.
          format: date
          example: '2020-10-10'
        identificationExpiryDate:
          type:
          - string
          - 'null'
          description: The expiry date of the guest's identification document.
          format: date
          example: '2020-10-10'
        identificationIssuePlace:
          type:
          - string
          - 'null'
          description: The issue place of the guest's identification document.
        identificationType:
          type:
          - string
          - 'null'
          description: 'The type of the identificationNumber

            Allowed values for this field depend on the country in which the property is located.

            Use /booking/v0-nsfw/types/IdentificationType/allowed-values to check what values are allowed.'
          enum:
          - SocialInsuranceNumber
          - PassportNumber
          - IdNumber
          - DriverLicenseNumber
          - VisaNumber
          - ForeignerIdentityNumber
          - TaxIdentificationNumber
          - Other
        personalTaxId:
          type:
          - string
          - 'null'
          description: The personal tax id of the guest
        company:
          $ref: '#/components/schemas/PersonCompanyModel'
        preferredLanguage:
          type:
          - string
          - 'null'
          description: 'ISO 639-1 language code (the language, not the country code):

            e.g. vi not vn, ja not jp, cs not cz, zh not cn.'
        birthDate:
          type:
          - string
          - 'null'
          description: Guest's birthdate
          format: date
          example: '2020-10-10'
        birthPlace:
          type:
          - string
          - 'null'
          description: Guest's place of birth
        birthFirstName:
          type:
          - string
          - 'null'
          description: Guest's first name right after birth
        birthLastName:
          type:
          - string
          - 'null'
          description: Guest's last name right after birth
        motherFirstName:
          type:
          - string
          - 'null'
          description: Guest's mother's first name
        motherLastName:
          type:
          - string
          - 'null'
          description: Guest's mother's last name
        borderCrossingPlace:
          type:
          - string
          - 'null'
          description: The place through which the guest crossed the border
        borderCrossingDate:
          type:
          - string
          - 'null'
          description: Date on which the guest crossed the border
          format: date
          example: '2020-10-10'
        nextDestination:
          type:
          - string
          - 'null'
          description: The guest's next destination address
        relationshipToPrimaryGuest:
          type:
          - string
