  /booking/v0-nsfw/reservations/{id}:
    get:
      tags:
      - Reservation
      summary: Returns a specific reservation
      description: 'Retrieves a reservation, specified by its ID.

        You must have at least one of these scopes: ''reservations.read, reservations.manage''.

        For fine-grained clients, you must have this permission: ''core.reservations.read''.'
      operationId: BookingReservationsByIdGet
      parameters:
      - in: path
        name: id
        description: Id of the reservation to be retrieved.
        required: true
        schema:
          type: string
      - in: query
        name: expand
        description: 'List of all embedded resources that should be expanded in the response. Possible values are: timeSlices, services, booker, actions, company, assignedUnits. All other values will be silently ignored.'
        schema:
          type: array
          items:
            type: string
            enum:
            - timeSlices
            - services
            - booker
            - actions
            - company
            - assignedUnits
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationModel'
        '404':
          description: The Request-URI could not be found.
        '400':
          description: Bad request.
        '401':
          description: You are unauthorized.
        '403':
          description: Forbidden.
        '499':
          description: Client closed request.
        '500':
          description: An unexpected error occurred.
        '503':
          description: The server is currently unavailable. Please try later.
        '422':
          description: Validation errors in the request body or query params.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageItemCollection'
      security:
      - oauth2:
        - reservations.read
        - reservations.manage
        - admin
    patch:
      tags:
      - Reservation
      summary: Allows to modify certain reservation properties
      description: 'Here is the list of operations that are currently allowed:

        - Add, replace and remove Comment

        - Add, replace and remove GuestComment

        - Add, replace and remove PaymentAccount

        - Add, replace and remove RegisteredCard

        - Add, replace and remove TravelPurpose

        - Add, replace and remove AdditionalGuests

        - Add, replace and remove ExternalReferences

        - Add a company (using company/Id, and only if not already set)

        - Add, replace and remove Commission

        - Replace PrimaryGuest

        - Remove ValidationMessages

        - Add, replace and remove MarketSegment

        - Replace IsOpenForCharges

        - Replace IsPreCheckedIn

        You must have this scope: ''reservations.manage''.

        For fine-grained clients, you must have this permission: ''core.reservations.modify''.'
      operationId: BookingReservationsByIdPatch
      parameters:
      - in: path
        name: id
        description: Id of the reservation to be modified.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Success
        '404':
          description: The Request-URI could not be found.
        '415':
          description: Unsupported media type.
        '400':
          description: Bad request.
        '401':
          description: You are unauthorized.
        '403':
          description: Forbidden.
        '499':
          description: Client closed request.
        '500':
          description: An unexpected error occurred.
        '503':
          description: The server is currently unavailable. Please try later.
        '422':
          description: Validation errors in the request body or query params.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageItemCollection'
      security:
      - oauth2:
        - reservations.manage
        - admin
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Operation'
        description: 'Define the list of operations to be applied to the resource. Learn more about JSON Patch here: http://jsonpatch.com/.'
        required: true
  /booking/v0-nsfw/reservations/{id}/offers:
    get:
      tags:
      - Reservation
      summary: Returns offers for one specific reservation
      description: 'Calculates and returns offers for amending a specific reservation.

        You must have at least one of these scopes: ''offers.read, reservations.manage''.

        For fine-grained clients, you must have this permission: ''core.reservations.read''.'
      operationId: BookingReservationsByIdOffersGet
      parameters:
      - in: path
        name: id
        description: Id of the reservation to be amended.
        required: true
        schema:
          type: string
      - in: query
        name: arrival
        description: Date and optional time of arrival<br />Specify either a pure date or a date and time (without fractional second part) in UTC or with UTC offset as defined in <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO8601:2004</a>
        schema:
          type: string
      - in: query
        name: departure
        description: Date and optional time of departure. Cannot be more than 5 years after arrival.<br />Specify either a pure date or a date and time (without fractional second part) in UTC or with UTC offset as defined in <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO8601:2004</a>
        schema:
          type: string
      - in: query
        name: adults
        description: Number of adults
        schema:
          type: integer
          format: int32
      - in: query
        name: childrenAges
        description: Ages of children
        schema:
          type: array
          items:
            type: integer
            format: int32
      - in: query
        name: channelCode
        description: The channel code used to filter the rate plans
        schema:
          type: string
          enum:
          - Direct
          - BookingCom
          - Ibe
          - ChannelManager
          - Expedia
          - Homelike
          - Hrs
          - AltoVita
          - DesVu
          - Gimsi
      - in: query
        name: promoCode
        description: The promo code associated with a certain special offer, like corporate rate
        schema:
          type: string
      - in: query
        name: corporateCode
        description: The code associated with a corporate rate
        schema:
          type: string
      - in: query
        name: requote
        description: 'Whether the offers should be re-quoted based on current prices, or only additions like change of number of adults should be calculated.

          Defaults to ''false'''
        schema:
          type: boolean
      - in: query
        name: includeUnavailable
        description: Return also offers that are currently not publicly bookable as restrictions are violated. By default only available offers are returned
        schema:
          type: boolean
      - in: query
        name: unitGroupIds
        description: The list of unit groups used to filter the offers.
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationStayOffersModel'
        '204':
          description: There are no available offers for the specified parameters.
        '404':
          description: The Request-URI could not be found.
        '400':
          description: Bad request.
        '401':
          description: You are unauthorized.
        '403':
          description: Forbidden.
        '499':
          description: Client closed request.
        '500':
          description: An unexpected error occurred.
        '503':
          description: The server is currently unavailable. Please try later.
        '422':
          description: Validation errors in the request body or query params.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageItemCollection'
      security:
      - oauth2:
        - offers.read
        - reservations.manage
        - admin
  /booking/v0-nsfw/reservations/{id}/service-offers:
    get:
      tags:
      - Reservation
      summary: Returns service offers for one specific reservation
      description: 'Calculates and returns service offers for a specific reservation.

        You must have at least one of these scopes: ''offers.read, reservations.manage''.

        For fine-grained clients, you must have this permission: ''core.reservations.read''.'
      operationId: BookingReservationsByIdService-offersGet
      parameters:
      - in: path
        name: id
        description: Id of the reservation.
        required: true
        schema:
          type: string
      - in: query
        name: channelCode
        description: The channel code used to filter the services
        schema:
          type: string
          enum:
          - Direct
          - BookingCom
          - Ibe
          - ChannelManager
          - Expedia
          - Homelike
          - Hrs
          - AltoVita
          - DesVu
          - Gimsi
      - in: query
        name: onlyDefaultDates
        description: 'Depending on the postNextDay setting of a service it will by default be posted before or after midnight.

          Breakfast is usually delivered on the next morning, so all the dates from the day after arrival to the departure day

          are default dates and will have this flag set to true. For services like a dinner it is the other way around.

          With this query parameter, you can also ask for the dates, that usually the service will not be booked. It defaults to true.'
        schema:
          type: boolean
      - in: query
        name: includeUnavailable
        description: Return also offers that are currently not publicly bookable as restrictions are violated. By default only available offers are returned
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
