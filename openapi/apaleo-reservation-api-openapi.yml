openapi: 3.2.0
info:
  title: apaleo Booking API - not safe for work Reservation API
  description: Continuously evolving version - use at your own risk! Resources and methods to manage guest journeys.
  version: v0-nsfw
tags:
- name: Reservation
paths:
  /booking/v0-nsfw/reservations:
    get:
      tags:
      - Reservation
      summary: Returns a list of all reservations, filtered by the specified parameters
      description: 'Returns a list of all reservations, filtered by the specified parameters. If no parameters are set, returns the entire list.

        You must have at least one of these scopes: ''reservations.read, reservations.manage''.

        For fine-grained clients, you must have this permission: ''core.reservations.read''.'
      operationId: BookingReservationsGet
      parameters:
      - in: query
        name: bookingId
        description: Filter result by booking id
        schema:
          type: string
      - in: query
        name: propertyIds
        description: Filter result by requested properties
        schema:
          type: array
          items:
            type: string
      - in: query
        name: ratePlanIds
        description: Filter result by requested rate plans
        schema:
          type: array
          items:
            type: string
      - in: query
        name: companyIds
        description: Filter result by requested companies
        schema:
          type: array
          items:
            type: string
      - in: query
        name: unitIds
        description: 'Filter result by assigned units.

          You can use the URL-encoded null symbol (%00)

          to search for reservations that have no unit assigned.'
        schema:
          type: array
          items:
            type: string
      - in: query
        name: unitGroupIds
        description: Filter result by requested unit groups
        schema:
          type: array
          items:
            type: string
      - in: query
        name: unitGroupTypes
        description: Filter result by requested unit group types
        schema:
          type: array
          items:
            type: string
            enum:
            - BedRoom
            - MeetingRoom
            - EventSpace
            - ParkingLot
            - Other
      - in: query
        name: blockIds
        description: Filter result by requested blocks
        schema:
          type: array
          items:
            type: string
      - in: query
        name: marketSegmentIds
        description: 'Filter result by requested market segments.

          You can use the URL-encoded null symbol (%00)

          to search for reservations that have no market segment set.'
        schema:
          type: array
          items:
            type: string
      - in: query
        name: status
        description: Filter result by reservation status
        schema:
          type: array
          items:
            type: string
            enum:
            - Confirmed
            - InHouse
            - CheckedOut
            - Canceled
            - NoShow
      - in: query
        name: dateFilter
        description: 'Filter by date and time attributes of reservation. Use in combination with the ''To'' and ''From'' attributes.

          All filters will check if the date specified by the filter type is between from (included) and to (excluded).

          The exception being filtering for ''stay'', which will return all reservations that are overlapping with the interval specified by from and to.'
        schema:
          type: string
          enum:
          - Arrival
          - Departure
          - Stay
          - Creation
          - Modification
          - Cancellation
          - ArrivalAndCheckIn
          - DepartureAndCheckOut
      - in: query
        name: from
        description: The start of the time interval. When filtering by date, at least one of 'from' and 'to' has to be specified<br />A date and time (without fractional second part) in UTC or with UTC offset as defined in <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO8601:2004</a>
        schema:
          type: string
          format: date-time
      - in: query
        name: to
        description: The end of the time interval, must be larger than 'from'. When filtering by date, at least one of 'from' and 'to' has to be specified<br />A date and time (without fractional second part) in UTC or with UTC offset as defined in <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO8601:2004</a>
        schema:
          type: string
          format: date-time
      - in: query
        name: channelCode
        description: Filter result by the channel code
        schema:
          type: array
          items:
            type: string
            enum:
            - Direct
            - BookingCom
            - Ibe
            - ChannelManager
            - Expedia
            - Homelike
            - Hrs
            - AltoVita
            - DesVu
            - Gimsi
      - in: query
        name: sources
        description: Filter result by source
        schema:
          type: array
          items:
            type: string
      - in: query
        name: validationMessageCategory
        description: Filter result by validation message category
        schema:
          type: array
          items:
            type: string
            enum:
            - OfferNotAvailable
            - AutoUnitAssignment
            - GuestLoyalty
      - in: query
        name: externalCode
        description: 'Filter result by the external code. The result set will contain all reservations that have an external code starting with the

          provided value'
        schema:
          type: string
      - in: query
        name: textSearch
        description: 'Filters reservations by searching for the provided text across multiple fields.

          The search is case-insensitive and includes:

          - Booker information (first name, last name, email, company name)

          - Primary guest information (first name, last name, email, company name)

          - Additional guest information (first name, last name, email, company name)

          - Reservation details (external code, external references, reservation ID)

          - Unit name

          - Group name'
        schema:
          type: string
      - in: query
        name: externalReferences
        description: This will filter all reservation where the provided external references have an exact match on at least one of the properties in Apaleo.Api.Modules.Booking.Models.Reservation.ExternalReferencesModel
        schema:
          type: array
          items:
            type: string
      - in: query
        name: balanceFilter
        description: This will filter reservations based on their balance.<br />You can provide an array of string expressions which all need to apply.<br />Each expression has the form of 'OPERATION_VALUE' where VALUE needs to be of the valid format of the property type and OPERATION can be:<br />'eq' for equals<br />'neq' for not equals<br />'lt' for less than<br />'gt' for greater than<br />'lte' for less than or equals<br />'gte' for greater than or equals<br />For instance<br />'eq_5' would mean the value should equal 5<br />'lte_7' would mean the value should be less than or equal to 7
        schema:
          type: array
          items:
            type: string
      - in: query
        name: allFoliosHaveInvoice
        description: 'If set to `true`, returns only reservations, in which all folios are closed and have an invoice.

          If set to `false`, returns only reservations, in which some of the folios are open or don''t have an invoice'
        schema:
          type: boolean
      - in: query
        name: isPreCheckedIn
        description: 'If set to `true`, returns only the reservations marked as pre-checked-in.

          If set to `false`, returns only the reservations not marked as pre-checked-in.'
        schema:
          type: boolean
      - in: query
        name: hasActivePaymentAccount
        description: 'If set to `true`, returns only the reservations with an active payment account.

          If set to `false`, returns only the reservations without an active payment account.'
        schema:
          type: boolean
      - in: query
        name: isUnitAssignmentLocked
        description: If set to `true`, returns only unit assignment locked reservations.
        schema:
          type: boolean
      - in: query
        name: pageNumber
        description: 'Page number to retrieve. Default: 1. If the page has no items, the API returns 204 No Content.'
        schema:
          type: integer
          default: 1
      - in: query
        name: pageSize
        description: 'Items per page. Default: 500. Maximum: 500.'
        schema:
          type: integer
          default: 500
      - in: query
        name: sort
        description: 'List of all fields that can be used to sort the results. Possible values are: arrival:asc, arrival:desc, departure:asc, departure:desc, created:asc, created:desc, updated:asc, updated:desc, balance:asc, balance:desc, id:asc, id:desc, firstname:asc, firstname:desc, lastname:asc, lastname:desc, unitname:asc, unitname:desc. All other values will be silently ignored.'
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - arrival:asc
            - arrival:desc
            - departure:asc
            - departure:desc
            - created:asc
            - created:desc
            - updated:asc
            - updated:desc
            - balance:asc
            - balance:desc
            - id:asc
            - id:desc
            - firstname:asc
            - firstname:desc
            - lastname:asc
            - lastname:desc
            - unitname:asc
            - unitname:desc
      - in: query
        name: expand
        description: 'List of all embedded resources that should be expanded in the response. Possible values are: booker, actions, timeSlices, services, assignedUnits, company. All other values will be silently ignored.'
        schema:
          type: array
          items:
            type: string
            enum:
            - booker
            - actions
            - timeSlices
            - services
            - assignedUnits
            - company
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationListModel'
        '204':
          description: No reservations found.
        '404':
          description: The Request-URI could not be found.
        '400':
          description: Bad request.
        '401':
          description: You are unauthorized.
        '403':
          description: Forbidden.
        '499':
          description: Client closed request.
        '500':
          description: An unexpected error occurred.
        '503':
          description: The server is currently unavailable. Please try later.
        '422':
          description: Validation errors in the request body or query params.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageItemCollection'
      security:
      - oauth2:
        - reservations.read
        - reservations.manage
        - admin
