components:
  schemas:
    MessageItemCollection:
      type: object
      properties:
        messages:
          type:
          - array
          - 'null'
          items:
            type: string
          readOnly: true
      additionalProperties: false
    FailPaymentAccountRequest:
      type: object
      properties:
        paymentTransactionId:
          type:
          - string
          - 'null'
          description: Transaction Id of payment account in the payment service payment transaction log
        accountDetails:
          $ref: '#/components/schemas/PaymentAccountDetailsModel'
        failureReason:
          type:
          - string
          - 'null'
          description: Textual description of the failure reason.
      additionalProperties: false
      example:
        paymentTransactionId: VT6G6BFUR6XE5MHZARAX2ODK7Y
        accountDetails:
          accountNumber: '1111'
          accountHolder: John Doe
          expiryMonth: '8'
          expiryYear: '2018'
          paymentMethod: visa
          payerEmail: s.hopper@test.com
        failureReason: Card is expired
    CommitPaymentAccountRequest:
      type: object
      required:
      - payerReference
      properties:
        paymentTransactionId:
          type:
          - string
          - 'null'
          description: Transaction Id of payment account in the payment service payment transaction log
        accountDetails:
          $ref: '#/components/schemas/PaymentAccountDetailsModel'
        payerReference:
          type: string
          description: The reference used to uniquely identify the shopper (e.g. user ID or account ID).
          minLength: 1
        storedPaymentMethodId:
          type:
          - string
          - 'null'
          description: The stored payment method id
      additionalProperties: false
      example:
        paymentTransactionId: VT6G6BFUR6XE5MHZARAX2ODK7Y
        accountDetails:
          accountNumber: '1111'
          accountHolder: John Doe
          expiryMonth: '8'
          expiryYear: '2018'
          paymentMethod: visa
          payerEmail: s.hopper@test.com
        payerReference: E2419238-4E0F-4AFF-954B-FF2B7935452F
        storedPaymentMethodId: K9DTTJQD4HNG5S82
    SetPaymentAccountDetailsRequest:
      type: object
      required:
      - payerReference
      - storedPaymentMethodId
      properties:
        paymentTransactionId:
          type:
          - string
          - 'null'
          description: 'Transaction Id of payment account in the payment service payment transaction log

            Should match payment account Transaction Id if it has been already set, otherwise it will be used to set the Transaction Id of the payment account'
        accountDetails:
          $ref: '#/components/schemas/PaymentAccountDetailsModel'
        payerReference:
          type: string
          description: The reference used to uniquely identify the shopper (e.g. user ID or account ID).
          minLength: 1
        storedPaymentMethodId:
          type: string
          description: The stored payment method id
          minLength: 1
      additionalProperties: false
      example:
        paymentTransactionId: VT6G6BFUR6XE5MHZARAX2ODK7Y
        accountDetails:
          accountNumber: '1111'
          accountHolder: John Doe
          expiryMonth: '8'
          expiryYear: '2018'
          paymentMethod: visa
          payerEmail: s.hopper@test.com
        payerReference: E2419238-4E0F-4AFF-954B-FF2B7935452F
        storedPaymentMethodId: K9DTTJQD4HNG5S82
    PaymentAccountDetailsModel:
      type: object
      properties:
        accountNumber:
          type:
          - string
          - 'null'
          description: The last 4 characters of the card or account number
          maxLength: 4
        accountHolder:
          type:
          - string
          - 'null'
          description: The account or card holder
        expiryMonth:
          type:
          - string
          - 'null'
          description: The credit card's expiration month
        expiryYear:
          type:
          - string
          - 'null'
          description: The credit card's expiration year
        paymentMethod:
          type:
          - string
          - 'null'
          description: The payment method (e.g. visa)
        payerEmail:
          type:
          - string
          - 'null'
          description: The email address of the shopper / customer
          format: email
      additionalProperties: false
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        implicit:
          scopes:
            admin: Full access
            reservations.import: Import reservations
          authorizationUrl: https://identity.apaleo.com/connect/authorize
