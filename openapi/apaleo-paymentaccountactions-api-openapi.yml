tags:
- name: PaymentAccountActions
paths:
  /booking/v0-nsfw/payment-account-actions/{paymentAccountId}/commit:
    put:
      tags:
      - PaymentAccountActions
      summary: Sets payment account to success
      description: 'You must have this scope: ''payments.admin''.

        For fine-grained clients, you must have this permission: ''core.payment_accounts.commit''.'
      operationId: BookingPayment-account-actionsByPaymentAccountIdCommitPut
      parameters:
      - in: path
        name: paymentAccountId
        description: The identifier of the payment account
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '404':
          description: The Request-URI could not be found.
        '415':
          description: Unsupported media type.
        '400':
          description: Bad request.
        '401':
          description: You are unauthorized.
        '403':
          description: Forbidden.
        '499':
          description: Client closed request.
        '500':
          description: An unexpected error occurred.
        '503':
          description: The server is currently unavailable. Please try later.
        '422':
          description: Validation errors in the request body or query params.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageItemCollection'
      security:
      - oauth2:
        - payments.admin
        - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitPaymentAccountRequest'
        description: The details related to the payment account to commit
        required: true
