  /booking/v0-nsfw/reservation-actions/{id}/amend:
    put:
      tags:
      - ReservationActions
      summary: Allows you to amend the stay details of a reservation
      description: 'Modifies the stay-related data of a reservation.


        If a reservation is ''Confirmed'', you can change all fields.


        If a reservation is ''InHouse'', only changes to future time slices are possible.


        Changes to reservations that are in the status ''CheckedOut'' or ''Canceled'' are not possible at all.

        Regardless of requote value, the prices for time slices will be re-quoted based on current prices

        - rate plan changes

        - reservation is part of a block. The current rates of the block will be applied.

        You must have this scope: ''reservations.manage''.

        For fine-grained clients, you must have this permission: ''core.reservations.modify''.'
      operationId: BookingReservation-actionsByIdAmendPut
      parameters:
      - in: path
        name: id
        description: Id of the reservation that should be modified
        required: true
        schema:
          type: string
      responses:
        '204':
          description: The reservation has been changed.
        '404':
          description: The Request-URI could not be found.
        '415':
          description: Unsupported media type.
        '400':
          description: Bad request.
        '401':
          description: You are unauthorized.
        '403':
          description: Forbidden.
        '499':
          description: Client closed request.
        '500':
          description: An unexpected error occurred.
        '503':
          description: The server is currently unavailable. Please try later.
        '422':
          description: Validation errors in the request body or query params.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageItemCollection'
      security:
      - oauth2:
        - reservations.manage
        - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesiredStayDetailsModel'
        description: The new stay details that should be applied to the reservation.
        required: true
