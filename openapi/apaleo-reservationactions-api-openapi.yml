  /booking/v0-nsfw/reservation-actions/{id}/book-service:
    put:
      tags:
      - ReservationActions
      summary: Book the service for a specific reservation
      description: 'Use this to book a service for a specific reservation.

        Please note that when dates are specified, all desired dates must be specified or they will be removed if not posted to the folio.

        When an amount is specified, it is the price before taxes on services and before sales taxes, but including VAT, so those taxes are added on top of it.

        When an amount is omitted, the price is taken from the service configuration and matches the amount the service offer returns: sales taxes are added on top of it, while taxes on services have already been deducted from it and are reported separately.

        You must have this scope: ''reservations.manage''.

        For fine-grained clients, you must have this permission: ''core.reservations.modify''.'
      operationId: BookingReservation-actionsByIdBook-servicePut
      parameters:
      - in: path
        name: id
        description: Id of the reservation.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Booking of the service for the reservation was successful.
        '404':
          description: The Request-URI could not be found.
        '415':
          description: Unsupported media type.
        '400':
          description: Bad request.
        '401':
          description: You are unauthorized.
        '403':
          description: Forbidden.
        '499':
          description: Client closed request.
        '500':
          description: An unexpected error occurred.
        '503':
