openapi: 3.2.0
info:
  title: apaleo Booking API - not safe for work Reservation Actions…
  description: Continuously evolving version - use at your own risk! Resources and methods to manage guest journeys.
  version: v0-nsfw
tags:
- name: ReservationActions
paths:
  /booking/v0-nsfw/reservation-actions/{id}/assign-unit:
    put:
      tags:
      - ReservationActions
      summary: Assign a unit to a reservation
      description: 'Assigns one of the available units to a reservation which is in state ''Confirmed'' or ''InHouse''.

        You must have at least one of these scopes: ''reservations.assign-unit, reservations.manage''.

        For fine-grained clients, you must have this permission: ''core.reservations.modify''.'
      operationId: BookingReservation-actionsByIdAssign-unitPut
      parameters:
      - in: path
        name: id
        description: Id of the reservation a unit should be assigned to.
        required: true
        schema:
          type: string
      - in: query
        name: unitConditions
        description: The optional unit conditions for unit that you want to auto assign for.
        schema:
          type: array
          items:
            type: string
            enum:
            - Clean
            - CleanToBeInspected
            - Dirty
      responses:
        '200':
          description: Unit assignment was successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoAssignedUnitListModel'
        '404':
          description: The Request-URI could not be found.
        '400':
          description: Bad request.
        '401':
          description: You are unauthorized.
        '403':
          description: Forbidden.
        '499':
          description: Client closed request.
        '500':
          description: An unexpected error occurred.
        '503':
          description: The server is currently unavailable. Please try later.
        '422':
          description: Validation errors in the request body or query params.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageItemCollection'
      security:
      - oauth2:
        - reservations.assign-unit
        - reservations.manage
        - admin
  /booking/v0-nsfw/reservation-actions/{id}/assign-unit/{unitId}:
    put:
      tags:
      - ReservationActions
      summary: Assign a specific unit to a reservation
      description: 'Assigns a specific unit to a reservation which is in state ''Confirmed'' or ''InHouse''.

        If the unit is not available, the call will return an error, and no unit will be assigned.

        You must have at least one of these scopes: ''reservations.assign-unit, reservations.manage''.

        For fine-grained clients, you must have this permission: ''core.reservations.modify''.'
      operationId: BookingReservation-actionsByIdAssign-unitByUnitIdPut
      parameters:
      - in: path
        name: id
        description: Id of the reservation the unit should be assigned to.
        required: true
        schema:
          type: string
      - in: path
        name: unitId
        description: The id of the unit to be assigned.
        required: true
        schema:
          type: string
      - in: query
        name: from
        description: The start date and optional time for the unit assignment. If not specified, the reservation's arrival will be used.<br />Specify either a pure date or a date and time (without fractional second part) in UTC or with UTC offset as defined in <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO8601:2004</a>
        schema:
          type: string
      - in: query
        name: to
        description: The end date and optional time for the unit assignment. If not specified, the reservation's departure will be used.<br />Specify either a pure date or a date and time (without fractional second part) in UTC or with UTC offset as defined in <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO8601:2004</a>
        schema:
          type: string
      - in: query
        name: lockUnit
        description: Whether to lock the unit for the duration of the reservation. If not specified, the unit will not be locked.
        schema:
          type: boolean
      responses:
        '200':
          description: Unit assignment was successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignedUnitModel'
        '404':
          description: The Request-URI could not be found.
        '400':
          description: Bad request.
        '401':
          description: You are unauthorized.
        '403':
          description: Forbidden.
        '499':
          description: Client closed request.
        '500':
          description: An unexpected error occurred.
        '503':
          description: The server is currently unavailable. Please try later.
        '422':
          description: Validation errors in the request body or query params.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageItemCollection'
      security:
      - oauth2:
        - reservations.assign-unit
        - reservations.manage
        - admin
  /booking/v0-nsfw/reservation-actions/{id}/unassign-units:
    put:
      tags:
      - ReservationActions
      summary: Unassign units from a reservation
      description: 'Unassigns units for all time slices of the given reservation. If no units are assigned for the

        reservation nothing will happen. It will fail for reservations in status ''CheckedOut''.

        You must have at least one of these scopes: ''reservations.assign-unit, reservations.manage''.

        For fine-grained clients, you must have this permission: ''core.reservations.modify''.'
      operationId: BookingReservation-actionsByIdUnassign-unitsPut
      parameters:
      - in: path
        name: id
        description: Id of the reservation the unit should be unassigned for.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Unassigning the unit was successful.
        '404':
          description: The Request-URI could not be found.
        '400':
          description: Bad request.
        '401':
          description: You are unauthorized.
        '403':
          description: Forbidden.
        '499':
          description: Client closed request.
        '500':
          description: An unexpected error occurred.
        '503':
          description: The server is currently unavailable. Please try later.
        '422':
          description: Validation errors in the request body or query params.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageItemCollection'
      security:
      - oauth2:
        - reservations.assign-unit
        - reservations.manage
        - admin
  /booking/v0-nsfw/reservation-actions/{id}/checkin:
    put:
      tags:
      - ReservationActions
      summary: Check-in of a reservation
      description: 'Check in a specific reservation which is in status ''Confirmed'', and has a unit assigned. This changes the status to ''InHouse'', and sets the check-in date and time.

        You must have this scope: ''reservations.manage''.

        For fine-grained clients, you must have this permission: ''core.reservations.modify''.'
      operationId: BookingReservation-actionsByIdCheckinPut
      parameters:
      - in: path
        name: id
        description: Id of the reservation that should be processed.
        required: true
        schema:
          type: string
      - in: query
        name: withCityTax
        description: Define if city tax should be added for this reservation or not. The default is "true".
        schema:
          type: boolean
      responses:
        '204':
          description: Check-in of the reservation was successful.
        '404':
          description: The Request-URI could not be found.
        '400':
          description: Bad request.
        '401':
          description: You are unauthorized.
        '403':
          description: Forbidden.
        '499':
          description: Client closed request.
        '500':
          description: An unexpected error occurred.
        '503':
          description: The server is currently unavailable. Please try later.
        '422':
          description: Validation errors in the request body or query params.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageItemCollection'
      security:
      - oauth2:
        - reservations.manage
        - admin
  /booking/v0-nsfw/reservation-actions/{id}/revert-checkin:
    put:
      tags:
      - ReservationActions
      summary: Reverses the check-in of a reservation
      description: 'You must have this scope: ''reservations.manage''.

        For fine-grained clients, you must have this permission: ''core.reservations.modify''.'
      operationId: BookingReservation-actionsByIdRevert-checkinPut
      parameters:
