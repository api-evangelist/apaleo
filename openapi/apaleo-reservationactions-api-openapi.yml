components:
  schemas:
    AutoAssignedUnitListModel:
      type: object
      required:
      - timeSlices
      properties:
        timeSlices:
          type: array
          description: The list of time slices with the respective assigned unit
          items:
            $ref: '#/components/schemas/AutoAssignedUnitItemModel'
      additionalProperties: false
      example:
        timeSlices:
        - unit:
            id: MUC-JQI
            name: A.102
            description: Double room
            unitGroupId: MUC-DBL
          from: '2026-10-16T17:00:00+02:00'
          to: '2026-10-17T11:00:00+02:00'
        - unit:
            id: MUC-MTA
            name: A.101
            description: Single room
            unitGroupId: MUC-SGL
          from: '2026-10-17T17:00:00+02:00'
          to: '2026-10-18T11:00:00+02:00'
    Date:
      type: object
      required:
      - serviceDate
      properties:
        serviceDate:
          type: string
          description: The date the service is delivered
          format: date
          example: '2020-10-10'
        count:
          type:
          - integer
          - 'null'
          description: The number of services to book for this date. It defaults to the service offer count when not specified.
          format: int32
        amount:
          $ref: '#/components/schemas/MonetaryValueModel'
      additionalProperties: false
    DesiredStayDetailsChannelModel:
      type: object
      required:
      - adults
      - arrival
      - departure
      - timeSlices
      properties:
        arrival:
          type: string
          description: Date and optional time of arrival<br />Specify either a pure date or a date and time (without fractional second part) in UTC or with UTC offset as defined in <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO8601:2004</a>
        departure:
          type: string
          description: Date and optional time of departure. Cannot be more than 5 years after arrival.<br />Specify either a pure date or a date and time (without fractional second part) in UTC or with UTC offset as defined in <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO8601:2004</a>
        adults:
          type: integer
          description: Number of adults
          format: int32
        childrenAges:
          type:
          - array
          - 'null'
          description: Ages of the children
          items:
            type: integer
            format: int32
        requote:
          type:
          - boolean
          - 'null'
          description: 'Whether the prices for time slices with no change to the rate plan should be re-quoted based on current prices, or if

            only additions like change of number of adults should be calculated. If a reservation is part of a block, the time slices prices will always be re-quoted to the current price of the block. Defaults to ''false''.'
        timeSlices:
          type: array
          description: The list of time slices
          items:
            $ref: '#/components/schemas/DesiredTimeSliceModel'
        pricingType:
          type:
          - string
          - 'null'
          description: The type of prices, before taxes, before taxes with VAT or after taxes
          enum:
          - BeforeTaxesWithVat
          - BeforeTaxes
          - AfterTaxes
        taxRemittanceResponsibility:
          type:
          - string
          - 'null'
          description: 'Specifies who is responsible for remitting taxes to local authorities for a reservation:

            - Hotel: The property (hotel) is responsible for remitting all applicable taxes.

            - OTA: The OTA (Online Travel Agency) remits at least one of the applicable taxes.

            If the value is not provided, the OTA does not provide any information about tax remittance and the default behavior is assumed.'
          enum:
          - Hotel
          - Ota
      additionalProperties: false
      example:
        arrival: '2026-10-18T17:00:00+02:00'
        departure: '2026-10-20T11:00:00+02:00'
        adults: 1
        childrenAges:
        - 6
        requote: false
        timeSlices:
        - ratePlanId: MUC-NONREF-DBL
          totalGrossAmount:
            amount: 86.0
            currency: EUR
        - ratePlanId: MUC-NONREF-DBL
          totalGrossAmount:
            amount: 101.0
            currency: EUR
        pricingType: BeforeTaxesWithVat
    AssignedUnitModel:
      type: object
      required:
      - unit
      properties:
        unit:
          $ref: '#/components/schemas/EmbeddedUnitModel'
      additionalProperties: false
      example:
        unit:
          id: MUC-JQI
          name: A.102
          description: Double room
          unitGroupId: MUC-DBL
    MessageItemCollection:
      type: object
      properties:
        messages:
          type:
          - array
          - 'null'
          items:
            type: string
          readOnly: true
      additionalProperties: false
    MonetaryValueModel:
      type: object
      required:
      - amount
      - currency
      properties:
        amount:
          type: number
          format: double
        currency:
          type: string
      additionalProperties: false
    DeleteReservationValidationMessagesRequest:
      type: object
      required:
      - codes
      properties:
        codes:
          type: array
          items:
            type: string
            enum:
            - UnitGroupFullyBooked
            - UnitGroupCapacityExceeded
            - RatePlanRestrictionsViolated
            - RatePlanSurchargesNotSet
            - RateRestrictionsViolated
            - RatePlanChannelNotSet
            - RatesNotSet
            - BlockFullyBooked
            - UnitMoved
            - IncludedServicesAmountExceededRateAmount
            - RatePlanCompanyRestrictionsViolated
            - ServiceFullyBooked
            - RateDoesNotSatifyHurdles
            - LoyaltyMembershipNotRecognized
      additionalProperties: false
    BookReservationServiceModel:
      type: object
      required:
      - serviceId
      properties:
        serviceId:
          type: string
          description: The id of the service you want to book
        count:
          type:
          - integer
          - 'null'
          description: The number of services to book for each service date. It defaults to the service offer count when not specified.
          format: int32
        amount:
          $ref: '#/components/schemas/MonetaryValueModel'
        dates:
          type:
          - array
          - 'null'
          description: The optional dates you want to book the service for; if not specified the default service pattern will be used (e.g. whole stay).
          items:
            $ref: '#/components/schemas/Date'
      additionalProperties: false
      example:
        serviceId: MUC-SPA
        dates:
        - serviceDate: '2026-10-16'
          amount:
            amount: 25.0
            currency: EUR
        - serviceDate: '2026-10-17'
    DesiredStayDetailsModel:
      type: object
      required:
      - adults
      - arrival
      - departure
      - timeSlices
      properties:
        arrival:
          type: string
          description: Date and optional time of arrival<br />Specify either a pure date or a date and time (without fractional second part) in UTC or with UTC offset as defined in <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO8601:2004</a>
        departure:
          type: string
          description: Date and optional time of departure. Cannot be more than 5 years after arrival.<br />Specify either a pure date or a date and time (without fractional second part) in UTC or with UTC offset as defined in <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO8601:2004</a>
        adults:
          type: integer
          description: Number of adults
          format: int32
        childrenAges:
          type:
          - array
          - 'null'
          description: Ages of the children
          items:
            type: integer
            format: int32
        requote:
          type:
          - boolean
          - 'null'
          description: 'Whether the prices for time slices with no change to the rate plan should be re-quoted based on current prices, or if

            only additions like change of number of adults should be calculated. If a reservation is part of a block, the time slices prices will always be re-quoted to the current price of the block. Defaults to ''false''.'
        timeSlices:
          type: array
          description: The list of time slices
          items:
            $ref: '#/components/schemas/DesiredTimeSliceModel'
      additionalProperties: false
      example:
        arrival: '2026-10-18T17:00:00+02:00'
        departure: '2026-10-20T11:00:00+02:00'
        adults: 1
        childrenAges:
        - 6
        requote: false
        timeSlices:
        - ratePlanId: MUC-NONREF-DBL
          totalGrossAmount:
            amount: 86.0
            currency: EUR
        - ratePlanId: MUC-NONREF-DBL
          totalGrossAmount:
            amount: 101.0
            currency: EUR
    DesiredTimeSliceModel:
      type: object
      required:
      - ratePlanId
      properties:
        ratePlanId:
          type: string
          description: The rate plan id for this time slice
        totalGrossAmount:
          $ref: '#/components/schemas/MonetaryValueModel'
      additionalProperties: false
    AddReservationValidationMessagesRequest:
      type: object
      required:
      - validationMessages
      properties:
        validationMessages:
          type: array
          items:
            $ref: '#/components/schemas/CreateReservationValidationMessageModel'
      additionalProperties: false
      example:
        validationMessages:
        - category: OfferNotAvailable
          code: UnitGroupFullyBooked
        - category: OfferNotAvailable
          code: RatePlanChannelNotSet
    CreateReservationValidationMessageModel:
      type: object
      required:
      - category
      - code
      properties:
        category:
          type: string
          enum:
          - OfferNotAvailable
          - AutoUnitAssignment
          - GuestLoyalty
        code:
          type: string
          enum:
          - UnitGroupFullyBooked
          - UnitGroupCapacityExceeded
          - RatePlanRestrictionsViolated
          - RatePlanSurchargesNotSet
          - RateRestrictionsViolated
          - RatePlanChannelNotSet
          - RatesNotSet
          - BlockFullyBooked
          - UnitMoved
          - IncludedServicesAmountExceededRateAmount
          - RatePlanCompanyRestrictionsViolated
          - ServiceFullyBooked
          - RateDoesNotSatifyHurdles
          - LoyaltyMembershipNotRecognized
      additionalProperties: false
    EmbeddedUnitModel:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          description: The unit id
        name:
          type:
          - string
          - 'null'
          description: The name for the unit
        description:
          type:
          - string
          - 'null'
          description: The description for the unit
        unitGroupId:
          type:
          - string
          - 'null'
          description: The unit group id
      additionalProperties: false
    AutoAssignedUnitItemModel:
      type: object
      required:
      - from
      - to
      - unit
      properties:
        unit:
          $ref: '#/components/schemas/EmbeddedUnitModel'
        from:
          type: string
          description: The start date and time for this time slice<br />A date and time (without fractional second part) in UTC or with UTC offset as defined in <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO8601:2004</a>
          format: date-time
        to:
          type: string
          description: The end date and time for this time slice<br />A date and time (without fractional second part) in UTC or with UTC offset as defined in <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO8601:2004</a>
          format: date-time
      additionalProperties: false
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        implicit:
          scopes:
            admin: Full access
            reservations.import: Import reservations
          authorizationUrl: https://identity.apaleo.com/connect/authorize
