      summary: Set a reservation to No-show
      description: 'Set a specific reservation to No-show which is in status ''Confirmed'' and where the arrival date is in the past.

        This changes the status to ''NoShow'', and sets the no-show date and time.

        You must have this scope: ''reservations.manage''.

        For fine-grained clients, you must have this permission: ''core.reservations.noshow''.'
      operationId: BookingReservation-actionsByIdNoshowPut
      parameters:
