  /booking/v0-nsfw/reservation-actions/{id}/checkout:
    put:
      tags:
      - ReservationActions
      summary: Check-out of a reservation
      description: 'Check out a specific reservation which is in status ''InHouse''. This changes the status to ''CheckedOut'', and sets the check-out date and time.

        All open charges on the folio will be posted.


        Check-out is only possible, if the departure date is not later than tomorrow. Otherwise, first amend the reservation and shorten the stay.

        You must have this scope: ''reservations.manage''.

        For fine-grained clients, you must have this permission: ''core.reservations.modify''.'
      operationId: BookingReservation-actionsByIdCheckoutPut
      parameters:
      - in: path
        name: id
        description: Id of the reservation that should be processed.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Check-out of the reservation was successful.
        '404':
          description: The Request-URI could not be found.
        '400':
          description: Bad request.
        '401':
          description: You are unauthorized.
        '403':
          description: Forbidden.
        '499':
          description: Client closed request.
        '500':
          description: An unexpected error occurred.
        '503':
          description: The server is currently unavailable. Please try later.
        '422':
          description: Validation errors in the request body or query params.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageItemCollection'
      security:
      - oauth2:
        - reservations.manage
        - admin
  /booking/v0-nsfw/reservation-actions/{id}/cancel:
    put:
      tags:
      - ReservationActions
      summary: Cancel a reservation
      description: 'Cancel a specific reservation which is in status ''Confirmed'' and where the arrival time is in the future.

        This changes the status to ''Canceled'', and sets the cancellation date and time.

        You must have this scope: ''reservations.manage''.

        For fine-grained clients, you must have this permission: ''core.reservations.cancel''.'
