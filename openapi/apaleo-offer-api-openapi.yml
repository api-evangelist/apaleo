openapi: 3.2.0
info:
  title: apaleo Booking API - not safe for work Offer API
  description: Continuously evolving version - use at your own risk! Resources and methods to manage guest journeys.
  version: v0-nsfw
tags:
- name: Offer
paths:
  /booking/v0-nsfw/offers:
    get:
      tags:
      - Offer
      summary: Returns offers for one specific stay
      description: 'Calculates and returns available offers for a specific property, arrival and departure date.

        You must have at least one of these scopes: ''offers.read, reservations.manage''.

        For fine-grained clients, you must have this permission: ''core.offers.read''.'
      operationId: BookingOffersGet
      parameters:
      - in: query
        name: propertyId
        description: The property ID
        required: true
        schema:
          type: string
      - in: query
        name: arrival
        description: Date and optional time of arrival<br />Specify either a pure date or a date and time (without fractional second part) in UTC or with UTC offset as defined in <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO8601:2004</a>
        required: true
        schema:
          type: string
      - in: query
        name: departure
        description: Date and optional time of departure. Cannot be more than 5 years after arrival.<br />Specify either a pure date or a date and time (without fractional second part) in UTC or with UTC offset as defined in <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO8601:2004</a>
        required: true
        schema:
          type: string
      - in: query
        name: timeSliceTemplate
        description: The time slice template used to filter the rate plans, defaults to 'over night'
        schema:
          type: string
          enum:
          - DayUse
          - OverNight
      - in: query
        name: timeSliceDefinitionIds
        description: Time slice definition IDs, used to filter rate plans
        schema:
          type: array
          items:
            type: string
      - in: query
        name: unitGroupIds
        description: Unit group IDs, used to filter rate plans
        schema:
          type: array
          items:
            type: string
      - in: query
        name: unitGroupTypes
        description: Unit group types, used to filter rate plans
        schema:
          type: array
          items:
            type: string
            enum:
            - BedRoom
            - MeetingRoom
            - EventSpace
            - ParkingLot
            - Other
      - in: query
        name: channelCode
        description: Channel code, used to filter the rate plans
        schema:
          type: string
          enum:
          - Direct
          - BookingCom
          - Ibe
          - ChannelManager
          - Expedia
          - Homelike
          - Hrs
          - AltoVita
          - DesVu
          - Gimsi
      - in: query
        name: promoCode
        description: The promo code associated with a certain special offer
        schema:
          type: string
      - in: query
        name: corporateCode
        description: The code associated with a corporate rate
        schema:
          type: string
      - in: query
        name: adults
        description: The number of adults you want offers for
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: childrenAges
        description: The ages of the children you want offers for
        schema:
          type: array
          items:
            type: integer
            format: int32
      - in: query
        name: includeUnavailable
        description: Return also offers that are currently not publicly bookable as restrictions are violated. By default only available offers are returned
        schema:
          type: boolean
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StayOffersModel'
        '204':
          description: There are no available offers for the specified parameters.
        '404':
          description: The Request-URI could not be found.
        '400':
          description: Bad request.
        '401':
          description: You are unauthorized.
        '403':
          description: Forbidden.
        '499':
          description: Client closed request.
        '500':
          description: An unexpected error occurred.
        '503':
          description: The server is currently unavailable. Please try later.
        '422':
          description: Validation errors in the request body or query params.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageItemCollection'
      security:
      - oauth2:
        - offers.read
        - reservations.manage
        - admin
  /booking/v0-nsfw/rate-plan-offers:
    get:
      tags:
      - Offer
      summary: Returns offers for a specific rate plan
      description: 'Calculates and returns available offers for a specific rate plan, arrival and departure date.

        You must have at least one of these scopes: ''offers.read, reservations.manage''.

        For fine-grained clients, you must have this permission: ''core.offers.read''.'
      operationId: BookingRate-plan-offersGet
      parameters:
      - in: query
        name: ratePlanId
        description: The rate plan ID
        required: true
        schema:
          type: string
      - in: query
        name: arrival
        description: Date and optional time of arrival<br />Specify either a pure date or a date and time (without fractional second part) in UTC or with UTC offset as defined in <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO8601:2004</a>
        required: true
        schema:
          type: string
      - in: query
        name: departure
        description: Date and optional time of departure. Cannot be more than 5 years after arrival.<br />Specify either a pure date or a date and time (without fractional second part) in UTC or with UTC offset as defined in <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO8601:2004</a>
        required: true
        schema:
          type: string
      - in: query
        name: channelCode
        description: The channel code
        schema:
          type: string
          enum:
          - Direct
          - BookingCom
          - Ibe
          - ChannelManager
          - Expedia
          - Homelike
          - Hrs
          - AltoVita
          - DesVu
          - Gimsi
      - in: query
        name: adults
        description: The number of adults you want offers for
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: childrenAges
        description: The ages of the children you want offers for
        schema:
          type: array
          items:
            type: integer
            format: int32
      - in: query
        name: includeUnavailable
        description: Return also offers that are currently not publicly bookable as restrictions are violated. By default only available offers are returned
        schema:
          type: boolean
      - in: query
        name: overridePrices
        description: Desired prices for each timeslice
        schema:
          type: array
          items:
            type:
            - number
            - 'null'
            format: double
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StayOffersModel'
        '204':
          description: There are no available offers for the specified parameters.
        '404':
          description: The Request-URI could not be found.
        '400':
          description: Bad request.
        '401':
          description: You are unauthorized.
        '403':
          description: Forbidden.
        '499':
          description: Client closed request.
        '500':
          description: An unexpected error occurred.
        '503':
          description: The server is currently unavailable. Please try later.
        '422':
          description: Validation errors in the request body or query params.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageItemCollection'
      security:
      - oauth2:
        - offers.read
        - reservations.manage
        - admin
  /booking/v0-nsfw/service-offers:
    get:
      tags:
      - Offer
      summary: Returns service offers for one specific stay
      description: 'You must have at least one of these scopes: ''offers.read, reservations.manage''.

        For fine-grained clients, you must have this permission: ''core.offers.read''.'
      operationId: BookingService-offersGet
      parameters:
      - in: query
        name: ratePlanId
        description: The rate plan ID
        required: true
        schema:
          type: string
      - in: query
        name: arrival
        description: Date and optional time of arrival<br />Specify either a pure date or a date and time (without fractional second part) in UTC or with UTC offset as defined in <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO8601:2004</a>
        required: true
        schema:
          type: string
      - in: query
        name: departure
        description: Date and optional time of departure. Cannot be more than 5 years after arrival.<br />Specify either a pure date or a date and time (without fractional second part) in UTC or with UTC offset as defined in <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO8601:2004</a>
        required: true
        schema:
          type: string
      - in: query
        name: channelCode
        description: The channel code used to filter the services
        schema:
          type: string
          enum:
          - Direct
          - BookingCom
          - Ibe
          - ChannelManager
          - Expedia
          - Homelike
          - Hrs
          - AltoVita
          - DesVu
          - Gimsi
      - in: query
        name: adults
        description: The number of adults you want offers for
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: childrenAges
        description: The ages of the children you want offers for
        schema:
          type: array
          items:
            type: integer
            format: int32
      - in: query
        name: onlyDefaultDates
        description: 'Depending on the postNextDay setting of a service it will be posted before or after midnight.

          Breakfast is usually delivered on the next morning, having ''postNextDay'' set to true. Its ''default dates'' are from the day after

          arrival until the departure day. For services like dinner ''postNextDay'' is false, and default dates are day of arrival until one

          day before departure.

          With this query parameter set to ''false'', you can also ask for dates outside of those default dates. It defaults to true.'
        schema:
          type: boolean
      - in: query
        name: includeUnavailable
        description: Return also offers that are currently not publicly bookable as restrictions are violated. By default only available offers are returned
        schema:
          type: boolean
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOffersModel'
        '204':
          description: There are no available offers for the specified parameters.
        '404':
          description: The Request-URI could not be found.
        '400':
          description: Bad request.
        '401':
          description: You are unauthorized.
        '403':
          description: Forbidden.
        '499':
          description: Client closed request.
        '500':
          description: An unexpected error occurred.
        '503':
          description: The server is currently unavailable. Please try later.
        '422':
          description: Validation errors in the request body or query params.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageItemCollection'
      security:
      - oauth2:
        - offers.read
        - reservations.manage
        - admin
  /booking/v0-nsfw/offer-index:
    get:
      tags:
      - Offer
      summary: Returns offers with rates and availabilities for the specified range
      description: 'Calculates and returns offers per time slice for a specific rate plan, arrival and departure date.

        You must have at least one of these scopes: ''offer-index.read, offers.read''.

        For fine-grained clients, you must have this permission: ''core.offers.read''.'
      operationId: BookingOffer-indexGet
      parameters:
      - in: query
        name: ratePlanId
        required: true
        schema:
          type: string
      - in: query
        name: from
        description: <br />Specify either a pure date or a date and time (without fractional second part) in UTC or with UTC offset as defined in <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO8601:2004</a>
        required: true
        schema:
          type: string
      - in: query
        name: to
        description: <br />Specify either a pure date or a date and time (without fractional second part) in UTC or with UTC offset as defined in <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO8601:2004</a>
        required: true
        schema:
          type: string
      - in: query
        name: channelCode
        required: true
        schema:
          type: string
          enum:
          - Direct
          - BookingCom
          - Ibe
          - ChannelManager
          - Expedia
          - Homelike
          - Hrs
          - AltoVita
          - DesVu
          - Gimsi
      - in: query
        name: pageNumber
        description: 'Page number to retrieve. Default: 1. If the page has no items, the API returns 204 No Content.'
        schema:
          type: integer
          default: 1
      - in: query
        name: pageSize
        description: 'Items per page. Default: 500. Maximum: 500.'
        schema:
          type: integer
          default: 500
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeSliceListModel'
        '204':
          description: There are no rates for the specified parameters.
        '404':
          description: The Request-URI could not be found.
        '400':
          description: Bad request.
        '401':
          description: You are unauthorized.
        '403':
          description: Forbidden.
        '499':
          description: Client closed request.
        '500':
          description: An unexpected error occurred.
        '503':
          description: The server is currently unavailable. Please try later.
        '422':
          description: Validation errors in the request body or query params.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageItemCollection'
      security:
      - oauth2:
        - offer-index.read
        - offers.read
        - admin
  /booking/v0-nsfw/offer-index-bulk:
    get:
      tags:
      - Offer
      summary: Returns offers with rates and availabilities for the specified range
      description: 'Calculates and returns offers per time slice for multiple rate plans, arrival and departure date.

        The rate plans must belong to the same unit group and have the same time slice definition.

        You must have at least one of these scopes: ''offer-index.read, offers.read''.

        For fine-grained clients, you must have this permission: ''core.offers.read''.'
      operationId: BookingOffer-index-bulkGet
      parameters:
      - in: query
        name: ratePlanIds
        required: true
        schema:
          type: array
          items:
            type: string
      - in: query
        name: from
        description: <br />Specify either a pure date or a date and time (without fractional second part) in UTC or with UTC offset as defined in <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO8601:2004</a>
        required: true
        schema:
          type: string
      - in: query
        name: to
        description: <br />Specify either a pure date or a date and time (without fractional second part) in UTC or with UTC offset as defined in <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO8601:2004</a>
        required: true
        schema:
          type: string
      - in: query
        name: channelCode
        required: true
        schema:
          type: string
          enum:
          - Direct
          - BookingCom
          - Ibe
          - ChannelManager
          - Expedia
          - Homelike
          - Hrs
          - AltoVita
          - DesVu
          - Gimsi
      - in: query
        name: pageNumber
        description: 'Page number to retrieve. Default: 1. If the page has no items, the API returns 204 No Content.'
        schema:
          type: integer
          default: 1
      - in: query
        name: pageSize
        description: 'Items per page. Default: 500. Maximum: 500.'
        schema:
          type: integer
          default: 500
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkTimeSliceListModel'
        '204':
          description: There are no rates for the specified parameters.
        '404':
          description: The Request-URI could not be found.
        '400':
          description: Bad request.
        '401':
          description: You are unauthorized.
        '403':
          description: Forbidden.
        '499':
          description: Client closed request.
        '500':
          description: An unexpected error occurred.
        '503':
          description: The server is currently unavailable. Please try later.
        '422':
          description: Validation errors in the request body or query params.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageItemCollection'
      security:
      - oauth2:
        - offer-index.read
        - offers.read
        - admin
components:
  schemas:
    OfferNoShowFeeModel:
      type: object
      required:
      - code
      - description
      - fee
      - name
      properties:
        code:
          type: string
          description: The code of the no-show policy applied
        name:
          type: string
          description: The name of the no-show policy applied
          minLength: 1
        description:
          type: string
          description: The description of the no-show policy applied
          minLength: 1
        fee:
          $ref: '#/components/schemas/MonetaryValueModel'
      additionalProperties: false
    TimeSliceOfferItemModel:
      type: object
      required:
      - available
      - availableUnits
      - unitGroup
      properties:
        unitGroup:
          $ref: '#/components/schemas/EmbeddedUnitGroupModel'
        minGuaranteeType:
          type:
          - string
          - 'null'
          description: The minimum guarantee type for the offer
          enum:
          - PM6Hold
          - CreditCard
          - Prepayment
          - Company
          - Ota
        minAdvance:
          $ref: '#/components/schemas/PeriodModel'
        maxAdvance:
          $ref: '#/components/schemas/PeriodModel'
        available:
          type: integer
          description: The number of available units for the offer
          format: int32
        availableUnits:
          type: integer
          description: The number of available units for the offer considering overbookings
          format: int32
        restrictions:
          $ref: '#/components/schemas/RateRestrictionsModel'
        prices:
          type:
          - array
          - 'null'
          description: The prices for this offer
          items:
            $ref: '#/components/schemas/PerOccupancyPriceItemModel'
      additionalProperties: false
    ServiceOffersModel:
      type: object
      required:
      - services
      properties:
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceOfferUnstableModel'
      additionalProperties: false
      example:
        services:
        - service:
            id: MUC-WLAN
            code: WLAN
            name: High-Speed WLAN
            description: Upgrade the complimentary internet access to a high speed connection.
            pricingUnit: Room
            defaultGrossPrice:
              amount: 5.0
              currency: EUR
          count: 1
          availableCount: 2
          totalAmount:
            grossAmount: 20.0
            netAmount: 16.8
            vatType: Normal
            vatPercent: 19.0
            currency: EUR
          prePaymentAmount:
            amount: 20.0
            currency: EUR
          dates:
          - serviceDate: '2026-10-16'
            amount:
              grossAmount: 10.0
              netAmount: 8.4
              vatType: Normal
              vatPercent: 19.0
              currency: EUR
            isDefaultDate: false
            isMandatory: false
            availableCount: 5
          - serviceDate: '2026-10-17'
            amount:
              grossAmount: 10.0
              netAmount: 8.4
              vatType: Normal
              vatPercent: 19.0
              currency: EUR
            isDefaultDate: false
            isMandatory: false
            availableCount: 2
        - service:
            id: MUC-YOGA
            code: YOGA
            name: Sun Salutation
            description: Start the day with a private Yoga session with one of our certified trainers.
            pricingUnit: Person
            defaultGrossPrice:
              amount: 35.0
              currency: EUR
          count: 1
          totalAmount:
            grossAmount: 30.0
            netAmount: 25.21
            vatType: Normal
            vatPercent: 19.0
            currency: EUR
          prePaymentAmount:
            amount: 30.0
            currency: EUR
          dates:
          - serviceDate: '2026-10-17'
            amount:
              grossAmount: 30.0
              netAmount: 25.21
              vatType: Normal
              vatPercent: 19.0
              currency: EUR
            isDefaultDate: false
            isMandatory: false
            taxes:
            - taxDefinitionCode: WELLNESS-TAX
              amount:
                grossAmount: 2.0
                netAmount: 2.0
                vatType: Without
                vatPercent: 0.0
                currency: EUR
              remittedBy: Hotel
    EmbeddedRatePlanModel:
      type: object
      required:
      - id
      - isSubjectToCityTax
      properties:
        id:
          type: string
          description: The rate plan id
        code:
          type:
          - string
          - 'null'
          description: The code for the rate plan that can be shown in reports and table views
        name:
          type:
          - string
          - 'null'
          description: The name for the rate plan
        description:
          type:
          - string
          - 'null'
          description: The description for the rate plan
        isSubjectToCityTax:
          type: boolean
          description: Whether the rate plan is subject to city tax or not
      additionalProperties: false
    EmbeddedPropertyModel:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          description: The property id
        code:
          type:
          - string
          - 'null'
          description: The code for the property that can be shown in reports and table views
        name:
          type:
          - string
          - 'null'
          description: The name for the property
        description:
          type:
          - string
          - 'null'
          description: The description for the property
          readOnly: true
      additionalProperties: false
    OfferTimeSliceModel:
      type: object
      required:
      - availableUnits
      - baseAmount
      - from
      - to
      - totalGrossAmount
      properties:
        from:
          type: string
          description: The start date and time for this time slice<br />A date and time (without fractional second part) in UTC or with UTC offset as defined in <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO8601:2004</a>
          format: date-time
        to:
          type: string
          description: The end date and time for this time slice<br />A date and time (without fractional second part) in UTC or with UTC offset as defined in <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO8601:2004</a>
          format: date-time
        availableUnits:
          type: integer
          description: The number of available units for that time slice
          format: int32
        baseAmount:
          $ref: '#/components/schemas/AmountModel'
        totalGrossAmount:
          $ref: '#/components/schemas/MonetaryValueModel'
        includedServices:
          type:
          - array
          - 'null'
          description: The breakdown for services included in the offer
          items:
            $ref: '#/components/schemas/OfferServiceModel'
      additionalProperties: false
    TaxDetailModel:
      type: object
      required:
      - net
      - tax
      - vatPercent
      - vatType
      properties:
        vatType:
          type: string
          enum:
          - 'Null'
          - VeryReduced
          - Reduced
          - Normal
          - Without
          - Special
          - Special1
          - Special2
          - ReducedCovid19
          - NormalCovid19
          - Mixed
        vatPercent:
          type: number
          format: double
        net:
          $ref: '#/components/schemas/MonetaryValueModel'
        tax:
          $ref: '#/components/schemas/MonetaryValueModel'
      additionalProperties: false
    PriceModel:
      type: object
      required:
      - afterTax
      - beforeTax
      - currency
      - grossAmount
      - taxes
      properties:
        grossAmount:
          type: number
          description: 'Price including all included services and VAT - <b>DEPRECATED: This field will be removed soon, use BeforeTax + Taxes.Tax instead</b>'
          format: double
        beforeTax:
          type: number
          description: Price including all included services without VAT or any other taxes like city tax
          format: double
        afterTax:
          type: number
          description: Price including all included services, VAT and any other taxes like city tax
          format: double
        taxes:
          $ref: '#/components/schemas/TaxesModel'
        currency:
          type: string
          description: The currency for all prices and tax details
      additionalProperties: false
      example:
        grossAmount: 100.0
        beforeTax: 91.57
        afterTax: 101.71
        taxes:
          tax: 8.43
          cityTax: 1.71
        currency: USD
    OfferUnitGroupModel:
      type: object
      required:
      - code
      - description
      - id
      - maxPersons
      - name
      - type
      properties:
        id:
          type: string
          description: The unit group id
        code:
          type: string
          description: The code for the unit group that can be shown in reports and table views
        name:
          type: string
          description: The name for the unit group
          minLength: 1
        description:
          type: string
          description: The description for the unit group
          minLength: 1
        maxPersons:
          type: integer
          description: Maximum number of persons for the unit group
          format: int32
        rank:
          type:
          - integer
          - 'null'
          description: The unit group rank
          format: int32
        type:
          type: string
          description: The unit group type
          enum:
          - BedRoom
          - MeetingRoom
          - EventSpace
          - ParkingLot
          - Other
      additionalProperties: false
    AppliedTaxModel:
      type: object
      description: A tax applied according to a tax definition configured in the Taxes API.
      required:
      - amount
      - remittedBy
      - taxDefinitionCode
      properties:
        taxDefinitionCode:
          type: string
          description: The code of the tax definition that produced this tax
          minLength: 1
        amount:
          $ref: '#/components/schemas/AmountModel'
        remittedBy:
          type: string
          description: Who is responsible for remitting the tax
          enum:
          - Hotel
          - Ota
      additionalProperties: false
    MessageItemCollection:
      type: object
      properties:
        messages:
          type:
          - array
          - 'null'
          items:
            type: string
          readOnly: true
      additionalProperties: false
    RatePlanTimeSliceListModel:
      type: object
      required:
      - ratePlanId
      - timeSlices
      properties:
        ratePlanId:
          type: string
          description: The id of the rate plan
