openapi: 3.2.0
info:
  title: apaleo Booking API - not safe for work Group API
  description: Continuously evolving version - use at your own risk! Resources and methods to manage guest journeys.
  version: v0-nsfw
tags:
- name: Group
paths:
  /booking/v0-nsfw/groups:
    post:
      tags:
      - Group
      summary: Creates a group booking
      description: 'You must have at least one of these scopes: ''groups.create, reservations.manage''.

        For fine-grained clients, you must have this permission: ''core.groups.create''.'
      operationId: BookingGroupsPost
      parameters:
      - in: header
        name: Idempotency-Key
        description: "Unique key for safely retrying requests without accidentally performing the same operation twice. \nWe'll always send back the same response for requests made with the same key, \nand keys can't be reused with different request parameters. Keys expire after 24 hours."
        schema:
          type: string
      responses:
        '201':
          description: A new group booking was created.
          headers:
            Location:
              description: The location of the created resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupCreatedModel'
        '404':
          description: The Request-URI could not be found.
        '415':
          description: Unsupported media type.
        '400':
          description: Bad request.
        '401':
          description: You are unauthorized.
        '403':
          description: Forbidden.
        '499':
          description: Client closed request.
        '500':
          description: An unexpected error occurred.
        '503':
          description: The server is currently unavailable. Please try later.
        '422':
          description: Validation errors in the request body or query params.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageItemCollection'
      security:
      - oauth2:
        - groups.create
        - reservations.manage
        - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupModel'
        description: The details of the group that should be created.
        required: true
    get:
      tags:
      - Group
      summary: Returns a list of all group bookings, filtered by the specified parameters
      description: 'Returns a list of all group bookings, filtered by the specified parameters.

        If no parameters are set, returns the entire list

        You must have at least one of these scopes: ''groups.read, reservations.read, reservations.manage''.

        For fine-grained clients, you must have this permission: ''core.groups.read''.'
      operationId: BookingGroupsGet
      parameters:
      - in: query
        name: textSearch
        description: 'This will filter all group bookings for the provided free text. Currently it only looks up if either the group name, lastname,

          firstname, email or company name of the booker contains one of the provided values'
        schema:
          type: string
      - in: query
        name: propertyIds
        description: Filter result by requested properties
        schema:
          type: array
          items:
            type: string
      - in: query
        name: from
        description: 'The start of the time range. All groups that have blocks overlapping with the interval specified by from and to

          will be returned<br />A date and time (without fractional second part) in UTC or with UTC offset as defined in <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO8601:2004</a>'
        schema:
          type: string
          format: date-time
      - in: query
        name: to
        description: 'The end of the time range. All groups that have blocks overlapping with the interval specified by from and to

          will be returned<br />A date and time (without fractional second part) in UTC or with UTC offset as defined in <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO8601:2004</a>'
        schema:
          type: string
          format: date-time
      - in: query
        name: statuses
        description: Filter result by requested block status
        schema:
          type: array
          items:
            type: string
            enum:
            - Tentative
            - Definite
            - Canceled
            - Optional
      - in: query
        name: hasActivePaymentAccount
        description: 'If set to `true`, returns only the groups with an active payment account.

          If set to `false`, returns only the groups without an active payment account.'
        schema:
          type: boolean
      - in: query
        name: commercialStatuses
        description: Filter result by requested commercial status
        schema:
          type: array
          items:
            type: string
      - in: query
        name: operationalStatuses
        description: 'Filter result by requested operational status.

          Ignored when group operational status is not exposed.'
        schema:
          type: array
          items:
            type: string
            enum:
            - NoReservations
            - Upcoming
            - PartiallyInHouse
            - InHouse
            - PartiallyCheckedOut
            - Completed
      - in: query
        name: pageNumber
        description: 'Page number to retrieve. Default: 1. If the page has no items, the API returns 204 No Content.'
        schema:
          type: integer
          default: 1
      - in: query
        name: pageSize
        description: 'Items per page. Default: 500. Maximum: 500.'
        schema:
          type: integer
          default: 500
      - in: query
        name: sort
        description: 'List of all fields that can be used to sort the results. Possible values are: created:asc, created:desc, modified:asc, modified:desc, from:asc, from:desc, to:asc, to:desc. All other values will be silently ignored.'
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - created:asc
            - created:desc
            - modified:asc
            - modified:desc
            - from:asc
            - from:desc
            - to:asc
            - to:desc
      - in: query
        name: expand
        description: 'List of all embedded resources that should be expanded in the response. Possible values are: blocks, actions. All other values will be silently ignored.'
        schema:
          type: array
          items:
            type: string
            enum:
            - blocks
            - actions
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupListModel'
        '204':
          description: No group bookings found.
        '404':
          description: The Request-URI could not be found.
        '400':
          description: Bad request.
        '401':
          description: You are unauthorized.
        '403':
          description: Forbidden.
        '499':
          description: Client closed request.
        '500':
          description: An unexpected error occurred.
        '503':
          description: The server is currently unavailable. Please try later.
        '422':
          description: Validation errors in the request body or query params.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageItemCollection'
      security:
      - oauth2:
        - groups.read
        - reservations.read
        - reservations.manage
        - admin
  /booking/v0-nsfw/groups/{id}:
    get:
      tags:
      - Group
      summary: Returns a specific group booking
      description: 'Retrieves a specific group booking with all its related blocks

        You must have at least one of these scopes: ''groups.read, reservations.read, reservations.manage''.

        For fine-grained clients, you must have this permission: ''core.groups.read''.'
      operationId: BookingGroupsByIdGet
      parameters:
      - in: path
        name: id
        description: Id of the group booking to be retrieved.
        required: true
        schema:
          type: string
      - in: query
        name: expand
        description: 'List of all embedded resources that should be expanded in the response. Possible values are: blocks, actions. All other values will be silently ignored.'
        schema:
          type: array
          items:
            type: string
            enum:
            - blocks
            - actions
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupModel'
        '404':
          description: The Request-URI could not be found.
        '400':
          description: Bad request.
        '401':
          description: You are unauthorized.
        '403':
          description: Forbidden.
        '499':
          description: Client closed request.
        '500':
          description: An unexpected error occurred.
        '503':
          description: The server is currently unavailable. Please try later.
        '422':
          description: Validation errors in the request body or query params.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageItemCollection'
      security:
      - oauth2:
        - groups.read
        - reservations.read
        - reservations.manage
        - admin
    patch:
      tags:
      - Group
      summary: Allows to modify certain group booking properties
      description: 'Here is the list of operations that are currently allowed:

        - Add and replace Name

        - Add, replace and remove Comment

        - Add, replace and remove BookerComment

        - Add, replace and remove PaymentAccount

        - Add, replace and remove PropertyIds

        - Replace Booker

        You must have at least one of these scopes: ''groups.manage, reservations.manage''.

        For fine-grained clients, you must have this permission: ''core.groups.modify''.'
      operationId: BookingGroupsByIdPatch
      parameters:
      - in: path
        name: id
        description: Id of the group booking to be modified.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Success
        '404':
          description: The Request-URI could not be found.
        '415':
          description: Unsupported media type.
        '400':
          description: Bad request.
        '401':
          description: You are unauthorized.
        '403':
          description: Forbidden.
        '499':
          description: Client closed request.
        '500':
          description: An unexpected error occurred.
        '503':
          description: The server is currently unavailable. Please try later.
        '422':
          description: Validation errors in the request body or query params.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageItemCollection'
      security:
      - oauth2:
        - groups.manage
        - reservations.manage
        - admin
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Operation'
        description: 'Define the list of operations to be applied to the resource. Learn more about JSON Patch here: http://jsonpatch.com/.'
        required: true
    delete:
      tags:
      - Group
      summary: Delete a certain group booking
      description: 'Use this call to delete a group booking. This is only possible as long as no blocks exist that are linked to

        this group booking

        You must have at least one of these scopes: ''groups.manage, reservations.manage''.

        For fine-grained clients, you must have this permission: ''core.groups.delete''.'
      operationId: BookingGroupsByIdDelete
      parameters:
      - in: path
        name: id
        description: Id of the group booking to be deleted.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deletion of the group was successful.
        '404':
          description: The Request-URI could not be found.
        '400':
          description: Bad request.
        '401':
          description: You are unauthorized.
        '403':
          description: Forbidden.
        '499':
          description: Client closed request.
        '500':
          description: An unexpected error occurred.
        '503':
          description: The server is currently unavailable. Please try later.
        '422':
          description: Validation errors in the request body or query params.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageItemCollection'
      security:
      - oauth2:
        - groups.manage
        - reservations.manage
        - admin
    head:
      tags:
      - Group
      summary: Check if a certain group booking exists
      description: 'Check if a group booking exists by id

        You must have at least one of these scopes: ''groups.read, reservations.read, reservations.manage''.

        For fine-grained clients, you must have this permission: ''core.groups.read''.'
      operationId: BookingGroupsByIdHead
      parameters:
      - in: path
        name: id
        description: Id of the group booking to be checked for existence.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The group booking exists.
        '404':
          description: The Request-URI could not be found.
        '400':
          description: Bad request.
        '401':
          description: You are unauthorized.
        '403':
          description: Forbidden.
        '499':
          description: Client closed request.
        '500':
          description: An unexpected error occurred.
        '503':
          description: The server is currently unavailable. Please try later.
      security:
      - oauth2:
        - groups.read
        - reservations.read
        - reservations.manage
        - admin
  /booking/v0-nsfw/groups/$count:
    get:
      tags:
      - Group
      summary: Returns number of group bookings
      description: 'Returns number of group bookings matching the filter criteria

        You must have at least one of these scopes: ''groups.read, reservations.read, reservations.manage''.

        For fine-grained clients, you must have this permission: ''core.groups.read''.'
      operationId: BookingGroups$countGet
      parameters:
      - in: query
        name: textSearch
        description: 'This will filter all group bookings for the provided free text. Currently it only looks up if either the group name, lastname,

          firstname, email or company name of the booker contains one of the provided values'
        schema:
          type: string
      - in: query
        name: propertyIds
        description: Filter result by requested properties
        schema:
          type: array
          items:
            type: string
      - in: query
        name: from
        description: 'The start of the time range. All groups that have blocks overlapping with the interval specified by from and to

          will be returned<br />A date and time (without fractional second part) in UTC or with UTC offset as defined in <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO8601:2004</a>'
        schema:
          type: string
          format: date-time
      - in: query
        name: to
        description: 'The end of the time range. All groups that have blocks overlapping with the interval specified by from and to

          will be returned<br />A date and time (without fractional second part) in UTC or with UTC offset as defined in <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO8601:2004</a>'
        schema:
          type: string
          format: date-time
      - in: query
        name: statuses
        description: Filter result by requested block status
        schema:
          type: array
          items:
            type: string
            enum:
            - Tentative
            - Definite
            - Canceled
            - Optional
      - in: query
        name: hasActivePaymentAccount
        description: 'If set to `true`, returns only the groups with an active payment account.

          If set to `false`, returns only the groups without an active payment account.'
        schema:
          type: boolean
      - in: query
        name: commercialStatuses
        description: Filter result by requested commercial status
        schema:
          type: array
          items:
            type: string
      - in: query
        name: operationalStatuses
        description: 'Filter result by requested operational status.

          Ignored when group operational status is not exposed.'
        schema:
          type: array
          items:
            type: string
            enum:
            - NoReservations
            - Upcoming
            - PartiallyInHouse
            - InHouse
            - PartiallyCheckedOut
            - Completed
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountModel'
        '404':
          description: The Request-URI could not be found.
        '400':
          description: Bad request.
        '401':
          description: You are unauthorized.
        '403':
          description: Forbidden.
        '499':
          description: Client closed request.
        '500':
          description: An unexpected error occurred.
        '503':
          description: The server is currently unavailable. Please try later.
        '422':
          description: Validation errors in the request body or query params.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageItemCollection'
      security:
      - oauth2:
        - groups.read
        - reservations.read
        - reservations.manage
        - admin
  /booking/v0-nsfw/groups/{id}/reservations:
    post:
      tags:
      - Group
      summary: Add one or multiple reservations to an existing group booking using blocked…
      description: 'Creates new reservations and adds them to an existing group booking taking a list of reservations as input

        You must have at least one of these scopes: ''groups.manage, reservations.manage''.

        For fine-grained clients, you must have this permission: ''core.groups.modify''.'
      operationId: BookingGroupsByIdReservationsPost
      parameters:
      - in: path
        name: id
        description: Id of the group booking the reservations should be attached to.
        required: true
        schema:
          type: string
      - in: header
        name: Idempotency-Key
        description: "Unique key for safely retrying requests without accidentally performing the same operation twice. \nWe'll always send back the same response for requests made with the same key, \nand keys can't be reused with different request parameters. Keys expire after 24 hours."
        schema:
          type: string
      responses:
        '201':
          description: All new reservations were created and added to the group booking.
          headers:
            Location:
              description: The location of the created resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationsCreatedModel'
        '404':
          description: The Request-URI could not be found.
        '415':
          description: Unsupported media type.
        '400':
          description: Bad request.
        '401':
          description: You are unauthorized.
        '403':
          description: Forbidden.
        '499':
          description: Client closed request.
        '500':
          description: An unexpected error occurred.
        '503':
          description: The server is currently unavailable. Please try later.
        '422':
          description: Validation errors in the request body or query params.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageItemCollection'
      security:
      - oauth2:
        - groups.manage
        - reservations.manage
        - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PickUpReservationsModel'
        description: The list of reservations you want to create.
        required: true
components:
  schemas:
    GuestModel:
      type: object
      description: 'Guest on v0-nsfw booking endpoints. Sibling of Apaleo.Api.Modules.Booking.Models.Reservation.GuestModel (not a subclass):

        Swagger schema ids strip "Unstable", so inheriting the stable type would collide on "GuestModel".'
      required:
      - lastName
      properties:
        title:
          type:
          - string
          - 'null'
          description: Title of the guest
          enum:
          - Mr
          - Ms
          - Dr
          - Prof
          - Mrs
          - Other
        gender:
          type:
          - string
          - 'null'
          description: 'Gender of the guest

            Allowed values for this field depend on the country in which the property is located.

            Use /booking/v0-nsfw/types/Gender/allowed-values to check what values are allowed.'
          enum:
          - Female
          - Male
          - Other
          - Unknown
        firstName:
          type:
          - string
          - 'null'
          description: First name of the guest
        middleInitial:
          type:
          - string
          - 'null'
          description: Middle initial of the guest
        lastName:
          type: string
          description: Last name of the guest
          minLength: 1
        secondLastName:
          type:
          - string
          - 'null'
          description: Second last name of the guest
        email:
          type:
          - string
          - 'null'
          description: Email address of the guest
        phone:
          type:
          - string
          - 'null'
          description: Phone number of the guest
        address:
          $ref: '#/components/schemas/PersonAddressModel'
        nationalityCountryCode:
          type:
          - string
          - 'null'
          description: The guest's nationality, in ISO 3166-1 alpha-2 code
        identificationNumber:
          type:
          - string
          - 'null'
          description: The guest's identification number for the given identificationType.
        identificationAdditionalNumber:
          type:
          - string
          - 'null'
          description: The guest's additional identification number for the given identificationType.
        identificationIssueDate:
          type:
          - string
          - 'null'
          description: The issue date of the guest's identification document.
          format: date
          example: '2020-10-10'
        identificationExpiryDate:
          type:
          - string
          - 'null'
          description: The expiry date of the guest's identification document.
          format: date
          example: '2020-10-10'
        identificationIssuePlace:
          type:
          - string
          - 'null'
          description: The issue place of the guest's identification document.
        identificationType:
          type:
          - string
          - 'null'
          description: 'The type of the identificationNumber

            Allowed values for this field depend on the country in which the property is located.

            Use /booking/v0-nsfw/types/IdentificationType/allowed-values to check what values are allowed.'
          enum:
          - SocialInsuranceNumber
          - PassportNumber
          - IdNumber
          - DriverLicenseNumber
          - VisaNumber
          - ForeignerIdentityNumber
          - TaxIdentificationNumber
          - Other
        personalTaxId:
          type:
          - string
          - 'null'
          description: The personal tax id of the guest
        company:
          $ref: '#/components/schemas/PersonCompanyModel'
        preferredLanguage:
          type:
          - string
          - 'null'
          description: 'ISO 639-1 language code (the language, not the country code):

            e.g. vi not vn, ja not jp, cs not cz, zh not cn.'
        birthDate:
          type:
          - string
          - 'null'
          description: Guest's birthdate
          format: date
          example: '2020-10-10'
        birthPlace:
          type:
          - string
          - 'null'
          description: Guest's place of birth
        birthFirstName:
          type:
          - string
          - 'null'
          description: Guest's first name right after birth
        birthLastName:
          type:
          - string
          - 'null'
          description: Guest's last name right after birth
        motherFirstName:
          type:
          - string
          - 'null'
          description: Guest's mother's first name
        motherLastName:
          type:
          - string
          - 'null'
          description: Guest's mother's last name
        borderCrossingPlace:
          type:
          - string
          - 'null'
          description: The place through which the guest crossed the border
        borderCrossingDate:
          type:
          - string
          - 'null'
          description: Date on which the guest crossed the border
          format: date
          example: '2020-10-10'
        nextDestination:
          type:
          - string
          - 'null'
          description: The guest's next destination address
        relationshipToPrimaryGuest:
          type:
          - string
          - 'null'
          description: The relationship of the guest to the primary guest.
          enum:
          - Grandparent
          - Grandchild
          - GreatGrandparent
          - GreatGrandchild
          - Parent
          - Child
          - Sibling
          - ParentInLaw
          - ChildInLaw
          - SiblingInLaw
          - Spouse
          - UncleOrAunt
          - NephewOrNiece
          - Guardian
          - Other
        vehicleRegistration:
          $ref: '#/components/schemas/VehicleRegistrationModel'
        loyaltyMemberships:
          type:
          - array
          - 'null'
          description: Loyalty program memberships of the guest. Stored as sent; program codes are not validated against a catalog.
          items:
            $ref: '#/components/schemas/LoyaltyMembershipModel'
        isVip:
          type:
          - boolean
          - 'null'
          description: Whether the guest is a VIP. Omitted on update leaves the stored value unchanged. Omitted on create means the guest is not a VIP.
      additionalProperties: false
    GroupCreatedModel:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          description: Id of newly created group booking
      additionalProperties: false
      example:
        id: XPGMSXGF
    RegisteredCardModel:
      type: object
      description: 'Use registered card when you need to show details about a card you intend to add to

        the booking/reservation in the future as a real payment account.

        It is NOT a replacement of the deprecated PaymentAccount field.'
      properties:
        cardNumber:
          type:
          - string
          - 'null'
          description: The last 4 characters of the card number
          maxLength: 4
        cardHolder:
          type:
          - string
          - 'null'
          description: The account holder (e.g. cardholder)
        expiryMonth:
          type:
          - string
          - 'null'
          description: The credit card's expiration month
        expiryYear:
          type:
          - string
          - 'null'
          description: The credit card's expiration year
        paymentMethod:
          type:
          - string
          - 'null'
          description: The payment method (e.g. Visa)
        payerEmail:
          type:
          - string
          - 'null'
          description: The email address of the shopper / customer
        note:
          type:
          - string
          - 'null'
          description: Optional information, e.g. about card activation or failure to do so
        isVirtual:
          type: boolean
          description: Indicates if the payment account is a virtual credit card.
      additionalProperties: false
    BookerModel:
      type: object
      required:
      - lastName
      properties:
        title:
          type:
          - string
          - 'null'
          description: Title of the booker
          enum:
          - Mr
          - Ms
          - Dr
          - Prof
          - Mrs
          - Other
        gender:
          type:
          - string
          - 'null'
          description: Gender of the booker
          enum:
          - Female
          - Male
          - Other
          - Unknown
        firstName:
          type:
          - string
          - 'null'
          description: First name of the booker
        middleInitial:
          type:
          - string
          - 'null'
          description: Middle initial of the booker
        lastName:
          type: string
          description: Last name of the booker
          minLength: 1
        email:
          type:
          - string
          - 'null'
          description: Email address of the booker
        phone:
          type:
          - string
          - 'null'
          description: Phone number of the booker
        address:
          $ref: '#/components/schemas/PersonAddressModel'
        nationalityCountryCode:
          type:
          - string
          - 'null'
          description: The booker's nationality, in ISO 3166-1 alpha-2 code
        identificationNumber:
          type:
          - string
          - 'null'
          description: The booker's identification number for the given identificationType.
        identificationIssueDate:
          type:
          - string
          - 'null'
