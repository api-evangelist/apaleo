openapi: 3.2.0
info:
  title: apaleo API - not safe for work Booking API
  description: Continuously evolving version - use at your own risk! Resources and methods to manage guest journeys.
  version: v0-nsfw
tags:
- name: Booking
paths:
  /booking/v0-nsfw/bookings:
    post:
      tags:
      - Booking
      summary: Creates a booking for one or more reservations
      description: 'Creates a booking taking a list of reservations as input

        You must have at least one of these scopes: ''reservations.create, reservations.manage''.

        For fine-grained clients, you must have this permission: ''core.bookings.create''.'
      operationId: BookingBookingsPost
      parameters:
      - in: header
        name: Idempotency-Key
        description: "Unique key for safely retrying requests without accidentally performing the same operation twice. \nWe'll always send back the same response for requests made with the same key, \nand keys can't be reused with different request parameters. Keys expire after 24 hours."
        schema:
          type: string
      responses:
        '201':
          description: All new reservations were created.
          headers:
            Location:
              description: The location of the created resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCreatedModel'
        '404':
          description: The Request-URI could not be found.
        '415':
          description: Unsupported media type.
        '400':
          description: Bad request.
        '401':
          description: You are unauthorized.
        '403':
          description: Forbidden.
        '499':
          description: Client closed request.
        '500':
          description: An unexpected error occurred.
        '503':
          description: The server is currently unavailable. Please try later.
        '422':
          description: Validation errors in the request body or query params.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageItemCollection'
      security:
      - oauth2:
        - reservations.create
        - reservations.manage
        - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingModel'
        description: The list of reservations you want to create.
        required: true
    get:
      tags:
      - Booking
      summary: Returns a list of all bookings, filtered by the specified parameters
      description: 'Returns a list of all bookings, filtered by the specified parameters. If no parameters are set, returns the entire list.

        You must have at least one of these scopes: ''reservations.read, reservations.manage''.

        For fine-grained clients, you must have this permission: ''core.bookings.read''.'
      operationId: BookingBookingsGet
      parameters:
      - in: query
        name: reservationId
        description: Filter result by reservation id. The result set will contain all bookings having reservations with the specified id
        schema:
          type: string
      - in: query
        name: groupId
        description: Filter result by group id. The result set will contain all bookings having groups with the specified id
        schema:
          type: string
      - in: query
        name: bookingIds
        description: Filter result by booking id. Returns only the bookings matching the specified ids
        schema:
          type: array
          items:
            type: string
      - in: query
        name: channelCode
        description: Filter result by the channel code. The resul set will contain all bookings having reservations with the specified channel code
        schema:
          type: array
          items:
            type: string
            enum:
            - Direct
            - BookingCom
            - Ibe
            - ChannelManager
            - Expedia
            - Homelike
            - Hrs
            - AltoVita
            - DesVu
            - Gimsi
      - in: query
        name: externalCode
        description: Filter result by the external code. The result set will contain all bookings having reservations with external code starting with provided value
        schema:
          type: string
      - in: query
        name: textSearch
        description: 'This will filter all bookings for the provided free text. Currently it only looks up if either the lastname, firstname, email or company name of the booker

          contains one of the provided values'
        schema:
          type: string
      - in: query
        name: hasActivePaymentAccount
        description: 'If set to `true`, returns only the bookings with an active payment account.

          If set to `false`, returns only the bookings without an active payment account.'
        schema:
          type: boolean
      - in: query
        name: pageNumber
        description: 'Page number to retrieve. Default: 1. If the page has no items, the API returns 204 No Content.'
        schema:
          type: integer
          default: 1
      - in: query
        name: pageSize
        description: 'Items per page. Default: 500. Maximum: 500.'
        schema:
          type: integer
          default: 500
      - in: query
        name: expand
        description: 'List of all embedded resources that should be expanded in the response. Possible values are: property, unitGroup, ratePlan, services, reservations. All other values will be silently ignored.'
        schema:
          type: array
          items:
            type: string
            enum:
            - property
            - unitGroup
            - ratePlan
            - services
            - reservations
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingListModel'
        '204':
          description: No bookings found.
        '404':
          description: The Request-URI could not be found.
        '400':
          description: Bad request.
        '401':
          description: You are unauthorized.
        '403':
          description: Forbidden.
        '499':
          description: Client closed request.
        '500':
          description: An unexpected error occurred.
        '503':
          description: The server is currently unavailable. Please try later.
        '422':
          description: Validation errors in the request body or query params.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageItemCollection'
      security:
      - oauth2:
        - reservations.read
        - reservations.manage
        - admin
  /booking/v0-nsfw/bookings/$force:
    post:
      tags:
      - Booking
      summary: Creates a booking for one or more reservations regardless of availability or…
      description: 'Creates a booking taking a list of reservations as input.

        You must have at least one of these scopes: ''reservations.force-create, reservations.force-manage''.

