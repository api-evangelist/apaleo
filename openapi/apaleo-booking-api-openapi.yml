  /booking/v0-nsfw/bookings/{id}:
    get:
      tags:
      - Booking
      summary: Returns a specific booking
      description: 'Retrieves a booking with all its reservations.

        You must have at least one of these scopes: ''reservations.read, reservations.manage''.

        For fine-grained clients, you must have this permission: ''core.bookings.read''.'
      operationId: BookingBookingsByIdGet
      parameters:
      - in: path
        name: id
        description: Id of the booking to be retrieved.
        required: true
        schema:
          type: string
      - in: query
        name: expand
        description: 'List of all embedded resources that should be expanded in the response. Possible values are: property, unitGroup, ratePlan, services, reservations, propertyValues. All other values will be silently ignored.'
        schema:
          type: array
          items:
            type: string
            enum:
            - property
            - unitGroup
            - ratePlan
            - services
            - reservations
            - propertyValues
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingModel'
        '404':
          description: The Request-URI could not be found.
        '400':
          description: Bad request.
        '401':
          description: You are unauthorized.
        '403':
          description: Forbidden.
        '499':
          description: Client closed request.
        '500':
          description: An unexpected error occurred.
        '503':
          description: The server is currently unavailable. Please try later.
        '422':
          description: Validation errors in the request body or query params.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageItemCollection'
      security:
      - oauth2:
        - reservations.read
        - reservations.manage
        - admin
    patch:
      tags:
      - Booking
      summary: Allows to modify certain booking properties
      description: 'Here is the list of operations that are currently allowed:

        - Add, replace and remove PaymentAccount

        - Add, replace and remove RegisteredCard

        - Add, replace and remove Comment

        - Add, replace and remove BookerComment

        - Copy PaymentAccount, Comment and BookerComment from the booking to any reservation, or the other way around

        - Replace Booker

        You must have this scope: ''reservations.manage''.

        For fine-grained clients, you must have this permission: ''core.bookings.modify''.'
      operationId: BookingBookingsByIdPatch
      parameters:
      - in: path
        name: id
        description: Id of the booking to be modified.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Success
        '404':
          description: The Request-URI could not be found.
        '415':
          description: Unsupported media type.
        '400':
          description: Bad request.
        '401':
          description: You are unauthorized.
        '403':
          description: Forbidden.
        '499':
          description: Client closed request.
        '500':
          description: An unexpected error occurred.
        '503':
          description: The server is currently unavailable. Please try later.
        '422':
          description: Validation errors in the request body or query params.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageItemCollection'
      security:
      - oauth2:
        - reservations.manage
        - admin
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Operation'
        description: 'Define the list of operations to be applied to the resource. Learn more about JSON Patch here: http://jsonpatch.com/.'
        required: true
components:
  schemas:
    GuestModel:
      type: object
      description: 'Guest on v0-nsfw booking endpoints. Sibling of Apaleo.Api.Modules.Booking.Models.Reservation.GuestModel (not a subclass):

        Swagger schema ids strip "Unstable", so inheriting the stable type would collide on "GuestModel".'
      required:
      - lastName
      properties:
        title:
          type:
          - string
          - 'null'
          description: Title of the guest
          enum:
          - Mr
          - Ms
          - Dr
          - Prof
          - Mrs
          - Other
        gender:
          type:
          - string
          - 'null'
          description: 'Gender of the guest

            Allowed values for this field depend on the country in which the property is located.

            Use /booking/v0-nsfw/types/Gender/allowed-values to check what values are allowed.'
          enum:
          - Female
          - Male
          - Other
          - Unknown
        firstName:
          type:
          - string
          - 'null'
          description: First name of the guest
        middleInitial:
          type:
          - string
          - 'null'
          description: Middle initial of the guest
        lastName:
          type: string
          description: Last name of the guest
          minLength: 1
        secondLastName:
          type:
          - string
          - 'null'
          description: Second last name of the guest
        email:
          type:
          - string
          - 'null'
          description: Email address of the guest
        phone:
          type:
          - string
          - 'null'
          description: Phone number of the guest
        address:
          $ref: '#/components/schemas/PersonAddressModel'
        nationalityCountryCode:
          type:
          - string
          - 'null'
          description: The guest's nationality, in ISO 3166-1 alpha-2 code
        identificationNumber:
          type:
          - string
          - 'null'
          description: The guest's identification number for the given identificationType.
        identificationAdditionalNumber:
          type:
          - string
          - 'null'
          description: The guest's additional identification number for the given identificationType.
        identificationIssueDate:
          type:
          - string
          - 'null'
          description: The issue date of the guest's identification document.
          format: date
          example: '2020-10-10'
        identificationExpiryDate:
          type:
          - string
          - 'null'
          description: The expiry date of the guest's identification document.
          format: date
          example: '2020-10-10'
        identificationIssuePlace:
          type:
          - string
          - 'null'
          description: The issue place of the guest's identification document.
        identificationType:
          type:
          - string
          - 'null'
          description: 'The type of the identificationNumber

            Allowed values for this field depend on the country in which the property is located.

            Use /booking/v0-nsfw/types/IdentificationType/allowed-values to check what values are allowed.'
          enum:
          - SocialInsuranceNumber
          - PassportNumber
          - IdNumber
          - DriverLicenseNumber
          - VisaNumber
          - ForeignerIdentityNumber
          - TaxIdentificationNumber
          - Other
        personalTaxId:
          type:
          - string
          - 'null'
          description: The personal tax id of the guest
        company:
          $ref: '#/components/schemas/PersonCompanyModel'
        preferredLanguage:
          type:
          - string
          - 'null'
          description: 'ISO 639-1 language code (the language, not the country code):

            e.g. vi not vn, ja not jp, cs not cz, zh not cn.'
        birthDate:
          type:
          - string
          - 'null'
          description: Guest's birthdate
          format: date
          example: '2020-10-10'
        birthPlace:
          type:
          - string
          - 'null'
          description: Guest's place of birth
        birthFirstName:
          type:
          - string
          - 'null'
          description: Guest's first name right after birth
        birthLastName:
          type:
          - string
          - 'null'
          description: Guest's last name right after birth
        motherFirstName:
          type:
          - string
          - 'null'
          description: Guest's mother's first name
        motherLastName:
          type:
          - string
          - 'null'
          description: Guest's mother's last name
        borderCrossingPlace:
          type:
          - string
          - 'null'
          description: The place through which the guest crossed the border
        borderCrossingDate:
          type:
          - string
          - 'null'
          description: Date on which the guest crossed the border
          format: date
          example: '2020-10-10'
        nextDestination:
          type:
          - string
          - 'null'
          description: The guest's next destination address
        relationshipToPrimaryGuest:
          type:
          - string
          - 'null'
          description: The relationship of the guest to the primary guest.
          enum:
          - Grandparent
          - Grandchild
          - GreatGrandparent
          - GreatGrandchild
          - Parent
          - Child
          - Sibling
          - ParentInLaw
          - ChildInLaw
          - SiblingInLaw
          - Spouse
          - UncleOrAunt
          - NephewOrNiece
          - Guardian
          - Other
        vehicleRegistration:
          $ref: '#/components/schemas/VehicleRegistrationModel'
        loyaltyMemberships:
          type:
          - array
          - 'null'
          description: Loyalty program memberships of the guest. Stored as sent; program codes are not validated against a catalog.
          items:
            $ref: '#/components/schemas/LoyaltyMembershipModel'
        isVip:
          type:
          - boolean
          - 'null'
          description: Whether the guest is a VIP. Omitted on update leaves the stored value unchanged. Omitted on create means the guest is not a VIP.
      additionalProperties: false
    ExternalReferencesModel:
      type: object
      properties:
        globalDistributionSystemId:
          type:
          - string
          - 'null'
          description: The ID of the global distribution system.
        onlineTravelAgencyId:
          type:
          - string
          - 'null'
          description: The ID of the online travel agency.
        onlineBookingToolId:
          type:
          - string
          - 'null'
          description: The ID of the online booking tool.
        channelManagerId:
          type:
          - string
          - 'null'
          description: The ID of the channel manager.
        centralReservationSystemId:
          type:
          - string
          - 'null'
          description: The Central Reservation System Identifier
        legacyId:
          type:
          - string
          - 'null'
          description: The ID of the legacy PMS system.
      additionalProperties: false
    RegisteredCardModel:
      type: object
      description: 'Use registered card when you need to show details about a card you intend to add to

