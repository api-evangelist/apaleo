              postalCode: '12453'
              city: MyCity
              countryCode: GB
            vehicleRegistration:
              number: APA322
              countryCode: DE
          guaranteeType: CreditCard
          timeSlices:
          - ratePlanId: BER-FLEX-DBL
          - ratePlanId: BER-FLEX-DBL
          commission:
            commissionAmount:
              amount: 20.0
