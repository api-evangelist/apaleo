        schema:
          type: string
      responses:
        '201':
          description: All new reservations were created.
          headers:
            Location:
              description: The location of the created resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCreatedModel'
        '404':
          description: The Request-URI could not be found.
        '415':
          description: Unsupported media type.
        '400':
          description: Bad request.
        '401':
          description: You are unauthorized.
        '403':
          description: Forbidden.
        '499':
          description: Client closed request.
        '500':
          description: An unexpected error occurred.
        '503':
          description: The server is currently unavailable. Please try later.
        '422':
          description: Validation errors in the request body or query params.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageItemCollection'
      security:
      - oauth2:
        - reservations.force-create
        - reservations.force-manage
        - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChannelBookingModel'
        description: The list of reservations you want to create.
        required: true
  /booking/v0-nsfw/bookings/{id}/reservations:
    post:
      tags:
      - Booking
      summary: Add one or multiple reservations to an existing booking
      description: 'Creates new reservations and adds them to an existing booking taking a list of reservations as input

        You must have at least one of these scopes: ''reservations.create, reservations.manage''.

        For fine-grained clients, you must have this permission: ''core.bookings.modify''.'
