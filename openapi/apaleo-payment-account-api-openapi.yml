openapi: 3.2.0
info:
  title: apaleo Booking API - not safe for work Payment Account API
  description: Continuously evolving version - use at your own risk! Resources and methods to manage guest journeys.
  version: v0-nsfw
tags:
- name: Payment Account
paths:
  /booking/v0-nsfw/payment-accounts/by-terminal:
    post:
      tags:
      - Payment Account
      summary: Creates payment account by using the terminal
      description: 'You must have this scope: ''payment-accounts.manage''.

        For fine-grained clients, you must have this permission: ''core.payment_accounts.create''.'
      operationId: BookingPayment-accountsBy-terminalPost
      parameters:
      - in: header
        name: Idempotency-Key
        description: "Unique key for safely retrying requests without accidentally performing the same operation twice. \nWe'll always send back the same response for requests made with the same key, \nand keys can't be reused with different request parameters. Keys expire after 24 hours."
        schema:
          type: string
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: The location of the created resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAccountCreatedModel'
        '404':
          description: The Request-URI could not be found.
        '415':
          description: Unsupported media type.
        '400':
          description: Bad request.
        '401':
          description: You are unauthorized.
        '403':
          description: Forbidden.
        '499':
          description: Client closed request.
        '500':
          description: An unexpected error occurred.
        '503':
          description: The server is currently unavailable. Please try later.
        '422':
          description: Validation errors in the request body or query params.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageItemCollection'
      security:
      - oauth2:
        - payment-accounts.manage
        - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTerminalPaymentAccountRequest'
        description: The definition of the payment account to be created
        required: true
