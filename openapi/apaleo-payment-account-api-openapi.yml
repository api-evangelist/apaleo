  /booking/v0-nsfw/payment-accounts/by-pci-credit-card-token:
    post:
      tags:
      - Payment Account
      summary: Creates payment account by using a PCI proxy credit card token
      description: 'You must have this scope: ''payment-accounts.manage''.

        For fine-grained clients, you must have this permission: ''core.payment_accounts.create''.'
      operationId: BookingPayment-accountsBy-pci-credit-card-tokenPost
