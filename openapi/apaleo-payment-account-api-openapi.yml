components:
  schemas:
    PaymentAccountPaymentLinkModel:
      type: object
      properties:
        expiresAt:
          type: string
          description: The date and time the payment link expires<br />A date and time (without fractional second part) in UTC or with UTC offset as defined in <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO8601:2004</a>
          format: date-time
        url:
          type:
          - string
          - 'null'
          description: The URL to the payment link
      additionalProperties: false
    CreatePciTransactionIdPaymentAccountRequest:
      type: object
      required:
      - cardHolder
      - expiryMonth
      - expiryYear
      - propertyId
      - target
      - transactionId
      properties:
        target:
          $ref: '#/components/schemas/PaymentAccountTargetModel'
        propertyId:
          type: string
          description: 'The id of the property which configuration (e.g. currency) is used to create payment account.

            For reservation payment accounts should match the reservation property.'
        transactionId:
          type: string
          description: Pci Transaction Id to be used to authorize the payment account
          minLength: 1
        payerEmail:
          type:
          - string
          - 'null'
          description: The payer e-mail address
          format: email
        cardHolder:
          type: string
          description: The credit card holder name
          minLength: 1
        expiryMonth:
          type: string
          description: The credit card expiry month
          minLength: 1
          pattern: ^(0?[1-9]|1[012])$
        expiryYear:
          type: string
          description: The credit card expiry year
          minLength: 1
          pattern: ^\d{4}$
      additionalProperties: false
      example:
        target:
          type: Booking
          id: KYKXKLWL
        propertyId: MUC
        transactionId: '411111967831111885'
        payerEmail: mr.king@test.com
        cardHolder: Douglas King
        expiryMonth: '03'
        expiryYear: '2030'
    PaymentAccountTargetModel:
      type: object
      required:
      - id
      - type
      properties:
        type:
          type: string
          description: Payment account target type
          enum:
          - Booking
          - Reservation
        id:
          type: string
          description: Booking or reservation id
      additionalProperties: false
    MessageItemCollection:
      type: object
      properties:
        messages:
          type:
          - array
          - 'null'
          items:
            type: string
          readOnly: true
      additionalProperties: false
    PaymentAccountV2ListModel:
      type: object
      required:
      - count
      - paymentAccounts
      properties:
        paymentAccounts:
          type: array
          description: List of payment accounts
          items:
            $ref: '#/components/schemas/PaymentAccountV2Model'
        count:
          type: integer
          description: Total count of items
          format: int64
      additionalProperties: false
      example:
        paymentAccounts:
        - id: QWERTYUI
          target:
            type: Booking
            id: ASDFGHJK
          created: '2026-10-19T19:18:15.347357Z'
          updated: '2026-10-19T20:18:15.3473571Z'
          externalReference:
            paymentTransactionId: VT6G6BFUR6XE5MHZARAX2ODK7Y
          status: Pending
          payerInteraction: PaymentLink
          paymentLink:
            expiresAt: '2026-10-20T19:18:15.3473572Z'
            url: https://test.adyen.link/PL0E1BC57CAEE63F2F0
          accountDetails:
            accountNumber: '1111'
            accountHolder: John Doe
            expiryMonth: '8'
            expiryYear: '2018'
            paymentMethod: visa
            payerEmail: s.hopper@test.com
          isVirtual: false
          actions:
          - action: Cancel
            isAllowed: false
            reasons:
            - code: OnlySuccessfulPaymentAccountCanBeCanceled
              message: Only a successful payment account can be canceled.
        count: 1
    CreateAuthorizationPaymentAccountRequest:
      type: object
      required:
      - target
      - transactionReference
      properties:
        target:
          $ref: '#/components/schemas/PaymentAccountTargetModel'
        transactionReference:
          type: string
          description: Reference to the original authorization transaction
          minLength: 1
      additionalProperties: false
      example:
        target:
          type: Booking
          id: KYKXKLWL
        transactionReference: K9DTTJQD4HNG5S82
    ActionModel_PaymentAccountAction_NotAllowedPaymentAccountActionReason:
      type: object
      required:
      - action
      - isAllowed
      properties:
        action:
          type: string
          enum:
          - Cancel
          - ExpirePaymentLink
        isAllowed:
          type: boolean
        reasons:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ActionReasonModel_NotAllowedPaymentAccountActionReason'
      additionalProperties: false
    PaymentAccountCreatedModel:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          description: Created payment account id
      additionalProperties: false
      example:
        id: UBMFXUFH
    CreateStoredPaymentMethodAuthorizationPaymentAccountRequest:
      type: object
      required:
      - payerReference
      - storedPaymentMethodId
      - target
      properties:
        target:
          $ref: '#/components/schemas/PaymentAccountTargetModel'
        payerReference:
          type: string
          description: Reference to uniquely identify the payer
          minLength: 1
        storedPaymentMethodId:
          type: string
          description: 'Reference to uniquely identify the stored recurring authorization, or LATEST to use the latest stored payment method

            for the given payerReference'
          minLength: 1
        isVirtual:
          type: boolean
          description: Indicates if the payment account is a virtual credit card
        accountDetails:
          $ref: '#/components/schemas/PaymentAccountDetailsModel'
      additionalProperties: false
      example:
        target:
          type: Booking
          id: KYKXKLWL
        payerReference: 4c5b0e9d-819e-481f-bc32-85068267e641
        storedPaymentMethodId: K9DTTJQD4HNG5S82
        isVirtual: false
        accountDetails:
          accountNumber: '1111'
          accountHolder: John Doe
          expiryMonth: '8'
          expiryYear: '2018'
          paymentMethod: visa
          payerEmail: john@example.com
    CreatePciCreditCardTokenPaymentAccountRequest:
      type: object
      required:
      - cardHolder
      - creditCardToken
      - expiryMonth
      - expiryYear
      - propertyId
      - target
      - tokenType
      properties:
        target:
          $ref: '#/components/schemas/PaymentAccountTargetModel'
        propertyId:
          type: string
          description: 'The id of the property which configuration (e.g. currency) is used to create payment account.

            For reservation payment accounts should match the reservation property.'
        tokenType:
          type: string
          description: The type of the token and the token provider
          enum:
          - PciProxy
          - Payrails
        creditCardToken:
          type: string
          description: PCI credit card token to be used to authorize the payment account
          minLength: 1
        cvcToken:
          type:
          - string
          - 'null'
          description: PCI CVC token to be used to authorize the payment account
        payerEmail:
          type:
          - string
          - 'null'
          description: The payer e-mail address
          format: email
        cardHolder:
          type: string
          description: The credit card holder name
          minLength: 1
        expiryMonth:
          type: string
          description: The credit card expiry month
          minLength: 1
          pattern: ^(0?[1-9]|1[012])$
        expiryYear:
          type: string
          description: The credit card expiry year
          minLength: 1
          pattern: ^\d{4}$
        isVirtual:
          type: boolean
          description: Indicates if the payment account is a virtual credit card
        retryWithoutCvcOnCvcError:
          type: boolean
          description: 'Retry payment account creation without CVC if cvc error happened.

            Retry happens only if CvcToken is passed.'
      additionalProperties: false
      example:
        target:
          type: Booking
          id: KYKXKLWL
        propertyId: MUC
        tokenType: PciProxy
        creditCardToken: 411111GGCMUJ1111
        cvcToken: 1t28whJOQBSlqhUX26QjYjSO
        payerEmail: mr.king@test.com
        cardHolder: Douglas King
        expiryMonth: '03'
        expiryYear: '2030'
        isVirtual: false
        retryWithoutCvcOnCvcError: false
    ExternalPaymentAccountReferenceModel:
      type: object
      required:
      - paymentTransactionId
      properties:
        paymentTransactionId:
          type: string
          description: Identifies the payment authorization in the Payment Transaction API
          minLength: 1
      additionalProperties: false
    ActionReasonModel_NotAllowedPaymentAccountActionReason:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - OnlySuccessfulPaymentAccountCanBeCanceled
          - OnlyPendingPaymentLinkPaymentAccountCanBeExpired
        message:
          type: string
          minLength: 1
      additionalProperties: false
    CreateTerminalPaymentAccountRequest:
      type: object
      required:
      - propertyId
      - target
      - terminalId
      properties:
        target:
          $ref: '#/components/schemas/PaymentAccountTargetModel'
        propertyId:
          type: string
          description: 'The id of the property which configuration (e.g. currency) is used to create payment account.

            For reservation payment accounts should match the reservation property.'
        terminalId:
          type: string
          description: Terminal to be used for the payment account
          minLength: 1
      additionalProperties: false
      example:
        target:
          type: Booking
          id: KYKXKLWL
        propertyId: MUC
        terminalId: V400m-324689704
    PaymentAccountV2Model:
      type: object
      required:
      - created
      - id
      - payerInteraction
      - status
      - target
      - updated
      properties:
        id:
          type: string
          description: Payment account id
        target:
          $ref: '#/components/schemas/PaymentAccountTargetModel'
        created:
          type: string
          description: Date of creation<br />A date and time (without fractional second part) in UTC or with UTC offset as defined in <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO8601:2004</a>
          format: date-time
        updated:
          type: string
          description: Date of last modification<br />A date and time (without fractional second part) in UTC or with UTC offset as defined in <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO8601:2004</a>
          format: date-time
        externalReference:
          $ref: '#/components/schemas/ExternalPaymentAccountReferenceModel'
        status:
          type: string
          description: Status of the payment account
          enum:
          - Pending
          - Success
          - Failure
          - Canceled
          - Expired
        failureReason:
          type:
          - string
          - 'null'
          description: Human-readable failure reason
        payerInteraction:
          type: string
          description: Payer interaction of the payment account
          enum:
          - PciToken
          - Terminal
          - Authorization
          - PaymentLink
        paymentLink:
          $ref: '#/components/schemas/PaymentAccountPaymentLinkModel'
        accountDetails:
          $ref: '#/components/schemas/PaymentAccountDetailsModel'
        isVirtual:
          type: boolean
          description: Indicates if the payment account is a virtual credit card. If not specified it defaults to 'false'
        actions:
          type:
          - array
          - 'null'
          description: The list of actions for payment account
          items:
            $ref: '#/components/schemas/ActionModel_PaymentAccountAction_NotAllowedPaymentAccountActionReason'
      additionalProperties: false
      example:
        id: QWERTYUI
        target:
          type: Booking
          id: ASDFGHJK
        created: '2026-10-19T19:18:15.3416653Z'
        updated: '2026-10-19T20:18:15.3416674Z'
        externalReference:
          paymentTransactionId: VT6G6BFUR6XE5MHZARAX2ODK7Y
        status: Pending
        payerInteraction: PaymentLink
        paymentLink:
          expiresAt: '2026-10-20T19:18:15.3416679Z'
          url: https://test.adyen.link/PL0E1BC57CAEE63F2F0
        accountDetails:
          accountNumber: '1111'
          accountHolder: John Doe
          expiryMonth: '8'
          expiryYear: '2018'
          paymentMethod: visa
          payerEmail: s.hopper@test.com
        isVirtual: false
        actions:
        - action: Cancel
          isAllowed: false
          reasons:
          - code: OnlySuccessfulPaymentAccountCanBeCanceled
            message: Only a successful payment account can be canceled.
    CreatePaymentLinkPaymentAccountRequest:
      type: object
      required:
      - countryCode
      - expiresAt
      - propertyId
      - target
      properties:
        target:
          $ref: '#/components/schemas/PaymentAccountTargetModel'
        propertyId:
          type: string
          description: 'The id of the property which configuration (e.g. currency) is used to create payment account.

            For reservation payment accounts should match the reservation property.'
        expiresAt:
          type: string
          description: The date that the link expires<br />A date and time (without fractional second part) in UTC or with UTC offset as defined in <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO8601:2004</a>
          format: date-time
        countryCode:
          type: string
          description: The payer's country code
        description:
          type:
          - string
          - 'null'
          description: Payment account description. It will be shown on the payment form of the link
          maxLength: 280
        payerEmail:
          type:
          - string
          - 'null'
          description: 'The email address of the payer or cardholder. It can be used to verify the identity of the payer and

            allow to catch a fraudulent usage of the payment account if the email address does not match the one

            on file at the bank'
        returnUrl:
          type:
          - string
          - 'null'
          description: Website URL used for redirection after payment is completed using the payment link.
          maxLength: 8000
          pattern: ^https?:\/\/[^\s/$.?#].[^\s]*$
      additionalProperties: false
      example:
        target:
          type: Booking
          id: KYKXKLWL
        propertyId: MUC
        expiresAt: '2026-10-21T20:18:15.3349676Z'
        countryCode: DE
        description: Payment information for the booking
        payerEmail: user@email.com
        returnUrl: https://example.com/return
    PaymentAccountDetailsModel:
      type: object
      properties:
        accountNumber:
          type:
          - string
          - 'null'
          description: The last 4 characters of the card or account number
          maxLength: 4
        accountHolder:
          type:
          - string
          - 'null'
          description: The account or card holder
        expiryMonth:
          type:
          - string
          - 'null'
          description: The credit card's expiration month
        expiryYear:
          type:
          - string
          - 'null'
          description: The credit card's expiration year
        paymentMethod:
          type:
          - string
          - 'null'
          description: The payment method (e.g. visa)
        payerEmail:
          type:
          - string
          - 'null'
          description: The email address of the shopper / customer
          format: email
      additionalProperties: false
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        implicit:
          scopes:
            admin: Full access
            reservations.import: Import reservations
          authorizationUrl: https://identity.apaleo.com/connect/authorize
