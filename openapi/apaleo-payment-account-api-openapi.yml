  /booking/v0-nsfw/payment-accounts/{id}:
    get:
      tags:
      - Payment Account
      summary: Returns a single payment account by ID
      description: 'You must have at least one of these scopes: ''payment-accounts.read, payment-accounts.manage''.

        For fine-grained clients, you must have this permission: ''core.payment_accounts.read''.'
      operationId: BookingPayment-accountsByIdGet
      parameters:
      - in: path
        name: id
        description: The identifier of the payment account
        required: true
        schema:
          type: string
      - in: query
        name: expand
        description: 'List of all embedded resources that should be expanded in the response. Possible values are: actions. All other values will be silently ignored.'
        schema:
          type: array
          items:
            type: string
            enum:
            - actions
      responses:
        '200':
          description: Successfully returned payment account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAccountV2Model'
        '404':
          description: The Request-URI could not be found.
        '400':
          description: Bad request.
        '401':
          description: You are unauthorized.
        '403':
          description: Forbidden.
        '499':
          description: Client closed request.
        '500':
          description: An unexpected error occurred.
        '503':
