        - payment-accounts.read
        - payment-accounts.manage
        - admin
  /booking/v0-nsfw/payment-accounts:
    get:
      tags:
      - Payment Account
      summary: Returns a list of payment accounts based on the query parameters
      description: 'You must have at least one of these scopes: ''payment-accounts.read, payment-accounts.manage''.

        For fine-grained clients, you must have this permission: ''core.payment_accounts.read''.'
      operationId: BookingPayment-accountsGet
      parameters:
      - in: query
        name: paymentAccountIds
        description: Filter result by requested payment account Ids
        schema:
          type: array
          items:
            type: string
      - in: query
        name: propertyIds
        description: Filter result by requested properties
        schema:
          type: array
          items:
            type: string
      - in: query
        name: bookingIds
        description: 'Filter result by requested booking ids. Returns payment accounts that are related to the specified booking or booking reservations.

          Use in combination with the Apaleo.Api.Modules.Booking.Models.PaymentAccountV2.PaymentAccountV2ListRequest.TargetTypes to get payment accounts related only to bookings or to reservations.'
        schema:
          type: array
          items:
            type: string
      - in: query
        name: reservationIds
        description: Filter result by requested reservation ids
        schema:
          type: array
          items:
            type: string
      - in: query
        name: payerInteractions
        description: Filter result by payment account payer interactions
        schema:
          type: array
          items:
            type: string
            enum:
            - PciToken
            - Terminal
            - Authorization
            - PaymentLink
      - in: query
        name: status
        description: Filter result by payment account status
        schema:
          type: array
          items:
            type: string
            enum:
            - Pending
            - Success
            - Failure
            - Canceled
            - Expired
      - in: query
        name: targetTypes
        description: Filter by target types
        schema:
          type: array
          items:
            type: string
            enum:
            - Booking
            - Reservation
      - in: query
        name: dateField
        description: 'Filter result by date and time attributes of payment account. Use in combination with the Apaleo.Api.Modules.Booking.Models.PaymentAccountV2.PaymentAccountV2ListRequest.From and Apaleo.Api.Modules.Booking.Models.PaymentAccountV2.PaymentAccountV2ListRequest.To attributes.

          All filters will check if the date specified by the filter type is between Apaleo.Api.Modules.Booking.Models.PaymentAccountV2.PaymentAccountV2ListRequest.From (included) and Apaleo.Api.Modules.Booking.Models.PaymentAccountV2.PaymentAccountV2ListRequest.To (excluded).'
        schema:
          type: string
          enum:
          - Creation
          - Modification
      - in: query
        name: from
        description: The start of the time interval. When filtering by Apaleo.Api.Modules.Booking.Models.PaymentAccountV2.PaymentAccountV2ListRequest.DateField, at least one of Apaleo.Api.Modules.Booking.Models.PaymentAccountV2.PaymentAccountV2ListRequest.From and Apaleo.Api.Modules.Booking.Models.PaymentAccountV2.PaymentAccountV2ListRequest.To has to be specified<br />A date and time (without fractional second part) in UTC or with UTC offset as defined in <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO8601:2004</a>
        schema:
          type: string
          format: date-time
      - in: query
        name: to
        description: The end of the time interval, must be larger than Apaleo.Api.Modules.Booking.Models.PaymentAccountV2.PaymentAccountV2ListRequest.From. When filtering by Apaleo.Api.Modules.Booking.Models.PaymentAccountV2.PaymentAccountV2ListRequest.DateField, at least one of Apaleo.Api.Modules.Booking.Models.PaymentAccountV2.PaymentAccountV2ListRequest.From and Apaleo.Api.Modules.Booking.Models.PaymentAccountV2.PaymentAccountV2ListRequest.To has to be specified<br />A date and time (without fractional second part) in UTC or with UTC offset as defined in <a href="https://en.wikipedia.org/wiki/ISO_8601">ISO8601:2004</a>
        schema:
          type: string
          format: date-time
      - in: query
        name: paymentLinkUrls
        description: Filter by payment link urls
        schema:
          type: array
          items:
            type: string
      - in: query
        name: pageNumber
        description: 'Page number to retrieve. Default: 1. If the page has no items, the API returns 204 No Content.'
        schema:
          type: integer
          default: 1
      - in: query
        name: pageSize
        description: 'Items per page. Default: 500. Maximum: 500.'
        schema:
          type: integer
          default: 500
      - in: query
        name: sort
        description: 'List of all fields that can be used to sort the results. Possible values are: created:asc, created:desc, updated:asc, updated:desc, expiresat:asc, expiresat:desc. All other values will be silently ignored.'
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - created:asc
            - created:desc
            - updated:asc
            - updated:desc
            - expiresat:asc
            - expiresat:desc
      - in: query
        name: expand
        description: 'List of all embedded resources that should be expanded in the response. Possible values are: actions. All other values will be silently ignored.'
        schema:
          type: array
          items:
            type: string
            enum:
            - actions
      responses:
        '200':
          description: Successfully returned payment account list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAccountV2ListModel'
        '204':
          description: No payment accounts found.
        '404':
          description: The Request-URI could not be found.
        '400':
          description: Bad request.
        '401':
          description: You are unauthorized.
        '403':
          description: Forbidden.
        '499':
          description: Client closed request.
        '500':
          description: An unexpected error occurred.
        '503':
          description: The server is currently unavailable. Please try later.
        '422':
          description: Validation errors in the request body or query params.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageItemCollection'
      security:
      - oauth2:
        - payment-accounts.read
        - payment-accounts.manage
        - admin
  /booking/v0-nsfw/payment-accounts/by-pci-transaction-id-token:
