  - property
principles:
- name: Visibility
  description: Track rooms under management per property and reconcile against the monthly subscription invoice.
- name: Allocation
  description: Map per-property room counts and payment volume to internal cost centers and brands.
- name: Optimization
  description: Right-size active properties and rooms; use included APIs and the apaleo Store rather than paid custom integrations; consolidate to stay above the monthly minimum efficiently.
- name: Accountability
  description: Assign owners per property; review per-room spend and apaleo Pay fees monthly against budget.
