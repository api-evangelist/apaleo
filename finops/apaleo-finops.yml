meters:
- name: rooms_under_management
  description: Number of rooms under management, billed per room per month.
  unit: rooms
  aggregation: sum
  dimensions:
  - account
  - property
- name: subscription_minimum
  description: Monthly subscription minimum applied per account.
  unit: subscription
  aggregation: max
  dimensions:
  - account
- name: payment_transaction_volume
  description: Online transaction volume processed via apaleo Pay, billed as a percentage.
  unit: currency
  aggregation: sum
  dimensions:
