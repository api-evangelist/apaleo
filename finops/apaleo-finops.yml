description: >-
  FinOps view of apaleo platform spend. apaleo bills a per-room monthly
  subscription that includes the Open PMS, all APIs, the apaleo Store, and
  support, subject to a monthly minimum. apaleo Pay is billed separately as
  a percentage of online transaction volume. Costs scale primarily with the
  number of rooms under management rather than with API call volume.
notes: >-
  Per-room rate, monthly minimum, and payment percentages are subject to
  change and negotiation; verify against the apaleo pricing page during
  reconciliation.
